<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#fff;--card:#f7f8f9;--card2:#eef0f2;--tx:#111214;--mut:#8b8f96;--line:#e6e8eb;
--acc:#111214;--accfg:#fff;--red:#c8372d;--green:#0f7a52;
--fill:#f2f3f5;--bar:#eceef1;--tabbg:rgba(255,255,255,.88);
--f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
color-scheme:light
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
--bg:#0c0d0e;--card:#16181a;--card2:#1e2124;--tx:#f2f3f5;--mut:#8b8f96;--line:#26292d;
--acc:#f2f3f5;--accfg:#0c0d0e;--red:#ff6b60;--green:#3fcf8e;
--fill:#1a1d1f;--bar:#232629;--tabbg:rgba(12,13,14,.88);color-scheme:dark
}}
:root[data-theme=dark]{
--bg:#0c0d0e;--card:#16181a;--card2:#1e2124;--tx:#f2f3f5;--mut:#8b8f96;--line:#26292d;
--acc:#f2f3f5;--accfg:#0c0d0e;--red:#ff6b60;--green:#3fcf8e;
--fill:#1a1d1f;--bar:#232629;--tabbg:rgba(12,13,14,.88);color-scheme:dark
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);overscroll-behavior:none;
font:400 17px/1.35 var(--f);
-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100dvh}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
padding:calc(10px + env(safe-area-inset-top)) 20px 28px}
.tab{display:none}
.tab.on{display:block;animation:fade .18s}

/* Главный экран живёт без прокрутки: main перестаёт скроллиться,
   вкладка растягивается на всю высоту, тянется только сетка категорий. */
main.fixed{overflow:hidden;padding-bottom:0;display:flex;flex-direction:column}
main.fixed .tab.on{flex:1;min-height:0;display:flex;flex-direction:column;animation:none}
@keyframes fade{from{opacity:0}}

/* ---- нижняя панель ---- */
nav{display:flex;background:var(--tabbg);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);flex:none}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 0 7px;
display:flex;flex-direction:column;align-items:center;gap:4px;
font:500 10px/1 var(--f);letter-spacing:.2px;transition:color .15s}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--acc)}

/* ---- типографика ---- */
h1{font:600 28px/1.15 var(--f);letter-spacing:-.5px;margin:6px 0 20px}
.sec{font:500 12px/1 var(--f);color:var(--mut);text-transform:uppercase;
letter-spacing:.8px;margin:26px 2px 10px}
.hint{font:400 13px/1.5 var(--f);color:var(--mut);padding:2px 2px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
padding:12px 16px;margin-bottom:12px}

/* ---- вкладки расход/доход ---- */
.seg{display:flex;gap:26px;border-bottom:1px solid var(--line);margin:2px 2px 6px}
.seg button{background:none;border:0;color:var(--mut);font:500 15px/1 var(--f);
padding:10px 0 12px;position:relative;letter-spacing:.1px;transition:color .15s}
.seg button.on{color:var(--tx)}
.seg button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;
height:2px;background:var(--acc);border-radius:1px}

/* ---- сумма ---- */
.amt{text-align:center;font:600 46px/1 var(--f);letter-spacing:-2px;
padding:16px 0 14px;word-break:break-all;font-variant-numeric:tabular-nums;flex:none}
.amt.z{color:var(--mut)}
.amt.exp{color:var(--red)}
.amt.inc{color:var(--green)}
.amt em{font-style:normal;font-size:22px;font-weight:400;letter-spacing:0;
margin-left:9px;color:var(--mut);vertical-align:3px}

/* ---- строка даты и заметки ---- */
.meta{display:flex;align-items:center;gap:12px;flex:none;
border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.meta input{background:none;border:0;border-radius:0;padding:10px 0;
font:400 14px var(--f);color:var(--tx);box-shadow:none}
.meta input:focus{outline:none}
.meta input[type=date]{flex:none;width:auto;min-height:0;color:var(--mut)}
.meta #a-note{flex:1;min-width:0;text-align:right}
.meta #a-note::placeholder{color:var(--mut);opacity:.75}

/* ---- плитки категорий: единственная тянущаяся зона экрана ---- */
.cats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;
flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
overscroll-behavior:contain;align-content:start;padding:12px 0 4px}
.cat{background:none;border:1px solid var(--line);border-radius:10px;padding:7px 2px;
display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--mut);
font:500 10px/1.15 var(--f);text-align:center;min-height:60px;justify-content:center;
transition:border-color .12s,background .12s,color .12s}
.cat .e{font-size:19px;line-height:1;filter:grayscale(1);opacity:.85;transition:.12s}
.cat .n{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
overflow:hidden;width:100%;word-break:break-word}
.cat.on{border-color:var(--pick);color:var(--tx)}
.cat.on .e{filter:none;opacity:1}
.cat.add{color:var(--mut)}

/* ---- клавиатура: закреплена внизу, во всю ширину ---- */
.pad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;flex:none;
margin:0 -20px;padding:8px 16px 10px;
border-top:1px solid var(--line);background:var(--bg)}
.pad button{background:none;border:0;color:var(--tx);font:400 23px/1 var(--f);
height:44px;border-radius:10px;display:grid;place-items:center;
font-variant-numeric:tabular-nums;transition:background .12s}
.pad button:active{background:var(--fill)}
.pad button svg{width:22px;height:22px}
.pad button.k0{grid-column:span 2}
.pad button.ksave{grid-row:span 3;height:auto;background:var(--acc);color:var(--accfg);
border-radius:12px;display:flex;flex-direction:column;align-items:center;
justify-content:center;gap:6px;font:500 10px/1 var(--f);letter-spacing:.2px}
.pad button.ksave svg{width:24px;height:24px}
.pad button.ksave:active{background:var(--acc);opacity:.7}
.pad button.ksave:disabled{opacity:.25}
.cat.add .e{filter:none;opacity:1;display:grid;place-items:center}
.cat.add svg{width:21px;height:21px}

/* ---- списки ---- */
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border:0;
border-bottom:1px solid var(--line);width:100%;background:none;color:var(--tx);
text-align:left;font:inherit}
.row:last-child{border-bottom:0}
.row .e{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
font-size:17px;flex:none;background:var(--fill)}
.row .t{flex:1;min-width:0}
.row .t b{font:500 16px/1.25 var(--f);display:block;overflow:hidden;
text-overflow:ellipsis;white-space:nowrap}
.row .t small{font:400 13px/1.3 var(--f);color:var(--mut);display:block;margin-top:2px;
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small.lim{white-space:normal;overflow:visible}
.row .v{font:500 16px var(--f);white-space:nowrap;text-align:right;
font-variant-numeric:tabular-nums}
.row .v small{display:block;font:400 12px var(--f);color:var(--mut);margin-top:2px}
.row .ch{color:var(--mut);flex:none;display:grid;place-items:center}
.row .ch svg{width:16px;height:16px}

/* ---- полосы лимитов ---- */
.bar{height:4px;background:var(--bar);border-radius:2px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:2px;transition:width .3s}

/* ---- итоги месяца ---- */
.tot{display:flex;text-align:center}
.tot div{flex:1}
.tot span{display:block;font:400 12px var(--f);color:var(--mut);
margin-bottom:5px;letter-spacing:.2px}
.tot b{font:600 18px var(--f);letter-spacing:-.3px;font-variant-numeric:tabular-nums}

/* ---- переключатель месяца ---- */
.nav2{display:flex;align-items:center;justify-content:space-between;margin:6px 0 18px}
.nav2 b{font:600 22px var(--f);letter-spacing:-.4px}
.nav2 button{background:none;border:1px solid var(--line);color:var(--tx);
width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.nav2 button svg{width:15px;height:15px}
.nav2 button:disabled{opacity:.28}

/* ---- кнопки ---- */
.btn{display:block;width:100%;border:1px solid var(--acc);border-radius:12px;padding:15px;
font:500 16px var(--f);background:var(--acc);color:var(--accfg);
margin-bottom:10px;letter-spacing:.1px}
.btn:disabled{opacity:.28}
.btn.g{background:none;color:var(--tx);border-color:var(--line)}
.btn.r{background:none;color:var(--red);border-color:var(--line)}
.btn:active{opacity:.65}

.empty{text-align:center;color:var(--mut);font:400 15px/1.55 var(--f);padding:44px 20px}
.empty .e{font-size:30px;display:block;margin-bottom:12px;opacity:.4;filter:grayscale(1)}

/* ---- шторки ---- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;
z-index:50;animation:fade .2s}
.sheet{width:100%;background:var(--bg);border-top:1px solid var(--line);
border-radius:20px 20px 0 0;padding:6px 20px calc(20px + env(safe-area-inset-bottom));
max-height:90dvh;overflow-y:auto;animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:34px;height:4px;background:var(--line);border-radius:2px;margin:8px auto 16px}
.sheet h3{font:600 17px var(--f);text-align:center;margin-bottom:18px}

/* ---- поля ввода ---- */
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font:500 12px var(--f);color:var(--mut);
text-transform:uppercase;letter-spacing:.6px;margin:0 0 7px 2px}
input,textarea,select{font:400 16px var(--f);color:var(--tx);background:var(--card);
border:1px solid var(--line);border-radius:11px;padding:12px 14px;width:100%;
-webkit-appearance:none;appearance:none;-webkit-user-select:text;user-select:text}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc)}
input[type=date]{min-height:46px}
select{padding-right:36px;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),
linear-gradient(135deg,var(--mut) 50%,transparent 50%);
background-position:calc(100% - 19px) 21px,calc(100% - 14px) 21px;
background-size:5px 5px,5px 5px;background-repeat:no-repeat}
textarea{min-height:130px;font:400 13px/1.45 ui-monospace,Menlo,monospace;resize:none}

/* ---- выбор значка и цвета ---- */
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;
max-height:128px;overflow-y:auto;padding:2px}
.emo button{background:none;border:1px solid var(--line);border-radius:10px;
font-size:20px;padding:6px 0}
.emo button.on{border-color:var(--acc);background:var(--fill)}
.cols{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;padding:4px 2px 2px}
.cols button{aspect-ratio:1;border-radius:50%;border:0;position:relative}
.cols button.on::after{content:"";position:absolute;inset:-4px;
border:2px solid var(--tx);border-radius:50%}

/* ---- диаграмма ---- */
.donut{display:block;margin:2px auto 10px}
.dc{text-anchor:middle;fill:var(--tx)}
.dc .a{font:600 20px var(--f);letter-spacing:-.4px}
.dc .b{font:400 11px var(--f);fill:var(--mut);letter-spacing:.3px}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));
transform:translate(-50%,16px);background:var(--acc);color:var(--accfg);
padding:11px 20px;border-radius:11px;font:500 14px var(--f);opacity:0;
pointer-events:none;transition:.25s;z-index:99;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
<main id="main">
<section class="tab on" id="t-add"></section>
<section class="tab" id="t-month"></section>
<section class="tab" id="t-cats"></section>
<section class="tab" id="t-set"></section>
</main>
<nav id="nav">
<button data-t="add" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Добавить</button>
<button data-t="month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M7.5 20v-6.5M12 20V6M16.5 20v-9.5"/></svg>Месяц</button>
<button data-t="cats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>Категории</button>
<button data-t="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h8.6M17.4 8H20M4 16h3.1M11.9 16H20"/><circle cx="15" cy="8" r="2.4"/><circle cx="9.5" cy="16" r="2.4"/></svg>Настройки</button>
</nav>
</div>
<div id="sheets"></div>
<div id="toast"></div>
<script>
"use strict";

/* ---------- Константы ---------- */

var KEY = "budget_v1";

var CUR = [
  ["UAH","₴","Гривна"], ["RUB","₽","Рубль"], ["USD","$","Доллар"], ["EUR","€","Евро"],
  ["KZT","₸","Тенге"], ["PLN","zł","Злотый"], ["GBP","£","Фунт"], ["GEL","₾","Лари"]
];

var PAL = ["#ff3b30","#ff9500","#ffcc00","#34c759","#00c7be","#30b0c7","#007aff","#5856d6",
           "#af52de","#ff2d55","#a2845e","#8e8e93"];

var EMO = ["🛒","🍽","☕️","🍕","🚌","🚗","⛽️","✈️","🏠","💡","🧾","🛠","💊","🏥","🦷","🧴",
           "👕","👟","👜","💅","🎬","🎮","🎧","🎉","👶","🧸","🎁","🐾","📚","🎓","✏️","💻",
           "📱","📶","🏋️","⚽️","🚴","🏖","🍺","🚬","💳","🏦","💼","💰","📈","🔄","🤝","⭐️"];

/* Иконки интерфейса. Наследуют цвет от родителя через currentColor,
   поэтому активное состояние вкладок и кнопок работает само. */
function svg(body, w){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' +
         (w || 1.7) + '" stroke-linecap="round" stroke-linejoin="round">' + body + "</svg>";
}

var IC = {
  plus:  svg('<path d="M12 5v14M5 12h14"/>'),
  chev:  svg('<path d="M9 5l7 7-7 7"/>', 2),
  chevL: svg('<path d="M15 5l-7 7 7 7"/>', 2),
  check: svg('<path d="M4.5 12.5l5 5 10-11"/>', 2),
  back:  svg('<path d="M20 5H9.6L3.5 12l6.1 7H20a1.5 1.5 0 0 0 1.5-1.5v-11A1.5 1.5 0 0 0 20 5Z"/>' +
             '<path d="M16.5 9.5l-5 5m0-5 5 5"/>')
};

var MONTHS  = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
var MONTHS2 = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
var WDAYS   = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];

/* ---------- Утилиты ---------- */

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function el(id){ return document.getElementById(id); }

function pad2(n){ return n < 10 ? "0" + n : "" + n; }

function today(){
  var d = new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
}

function monthOf(iso){ return iso.slice(0,7); }

function monthTitle(mk){
  var p = mk.split("-");
  return MONTHS[parseInt(p[1],10)-1] + " " + p[0];
}

function shiftMonth(mk, delta){
  var p = mk.split("-"), d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1 + delta, 1);
  return d.getFullYear() + "-" + pad2(d.getMonth()+1);
}

function dayTitle(iso){
  var p = iso.split("-"), d = new Date(+p[0], +p[1]-1, +p[2]);
  var t = today();
  if (iso === t) return "Сегодня";
  var y = new Date(); y.setDate(y.getDate()-1);
  if (iso === y.getFullYear()+"-"+pad2(y.getMonth()+1)+"-"+pad2(y.getDate())) return "Вчера";
  return (+p[2]) + " " + MONTHS2[+p[1]-1] + ", " + WDAYS[d.getDay()];
}

/* ---------- Состояние ---------- */

function defaultCats(){
  var exp = [
    ["Продукты","🛒","#34c759"], ["Кафе и рестораны","🍽","#ff9500"], ["Транспорт","🚌","#007aff"],
    ["Жильё и коммуналка","🏠","#5856d6"], ["Здоровье","💊","#ff2d55"], ["Одежда","👕","#af52de"],
    ["Развлечения","🎬","#ff3b30"], ["Дети","👶","#00c7be"], ["Подарки","🎁","#ffcc00"],
    ["Питомцы","🐾","#a2845e"], ["Образование","📚","#30b0c7"], ["Подписки и связь","📱","#5856d6"],
    ["Техника","💻","#8e8e93"], ["Спорт","🏋️","#34c759"], ["Путешествия","✈️","#007aff"],
    ["Красота","💅","#ff2d55"], ["Авто","🚗","#ff9500"], ["Прочее","📦","#8e8e93"]
  ];
  var inc = [
    ["Зарплата","💼","#34c759"], ["Подработка","🤝","#00c7be"], ["Подарок","🎁","#ffcc00"],
    ["Инвестиции","📈","#007aff"], ["Возврат","🔄","#5856d6"], ["Прочее","📦","#8e8e93"]
  ];
  function mk(arr, kind){
    return arr.map(function(c){
      return { id: uid(), name: c[0], emoji: c[1], color: c[2], kind: kind, limit: null };
    });
  }
  return mk(exp,"expense").concat(mk(inc,"income"));
}

function defaultState(){
  return { version:1, currency:"UAH", symbol:null, totalLimit:null,
           categories: defaultCats(), tx: [] };
}

var S;

function loadState(){
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return defaultState();
    var s = JSON.parse(raw);
    if (!s || !Array.isArray(s.categories) || !Array.isArray(s.tx)) return defaultState();
    if (!s.currency) s.currency = "UAH";
    if (typeof s.totalLimit === "undefined") s.totalLimit = null;
    return s;
  } catch(e){ return defaultState(); }
}

function saveState(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast("Не удалось сохранить данные"); }
}

/* ---------- Деньги ---------- */

function symbol(){
  if (S.symbol) return S.symbol;
  for (var i=0;i<CUR.length;i++) if (CUR[i][0] === S.currency) return CUR[i][1];
  return "₴";
}

function fmt(n, withSym){
  var abs = Math.abs(n);
  var dec = Math.round(abs*100) % 100 === 0 ? 0 : 2;
  var s = new Intl.NumberFormat("ru-RU", {
    minimumFractionDigits: dec, maximumFractionDigits: dec
  }).format(n);
  return withSym === false ? s : s + " " + symbol();
}

/* ---------- Выборки ---------- */

function catById(id){
  for (var i=0;i<S.categories.length;i++) if (S.categories[i].id === id) return S.categories[i];
  return null;
}

function catsOf(kind){
  return S.categories.filter(function(c){ return c.kind === kind; });
}

function txOfMonth(mk){
  return S.tx.filter(function(t){ return monthOf(t.date) === mk; });
}

function sum(list){
  return list.reduce(function(a,t){ return a + t.amount; }, 0);
}

/* ---------- UI-помощники ---------- */

var toastTimer = null;
function toast(msg){
  var t = el("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("on"); }, 2000);
}

function openSheet(title, html, onMount){
  var ov = document.createElement("div");
  ov.className = "ov";
  ov.innerHTML = '<div class="sheet"><div class="grab"></div>' +
                 (title ? "<h3>" + esc(title) + "</h3>" : "") + html + "</div>";
  ov.addEventListener("click", function(e){ if (e.target === ov) closeSheet(); });
  el("sheets").appendChild(ov);
  if (onMount) onMount(ov);
  return ov;
}

function closeSheet(){
  var s = el("sheets");
  if (s.lastChild) s.removeChild(s.lastChild);
}

function confirmSheet(title, text, okLabel, danger, cb){
  openSheet(title,
    '<p class="hint" style="text-align:center;font-size:15px;padding:0 4px 18px">' + esc(text) + "</p>" +
    '<button class="btn' + (danger ? " r" : "") + '" id="cf-ok">' + esc(okLabel) + "</button>" +
    '<button class="btn g" id="cf-no">Отмена</button>',
    function(ov){
      ov.querySelector("#cf-ok").onclick = function(){ closeSheet(); cb(); };
      ov.querySelector("#cf-no").onclick = closeSheet;
    });
}

/* ---------- Вкладка «Добавить» ---------- */

var A = { kind:"expense", amt:"", cat:null, date:today(), note:"" };

/* Разряды в поле ввода: "1250,5" -> "1 250,5" (дробную часть не трогаем) */
function groupAmt(s){
  var p = s.split(","), i = p[0];
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return p.length > 1 ? i + "," + p[1] : i;
}

function renderAdd(){
  var cats = catsOf(A.kind);
  if (A.cat && !catById(A.cat)) A.cat = null;
  var sel = catById(A.cat);
  if (sel && sel.kind !== A.kind) A.cat = null;

  var disp = A.amt === "" ? "0" : groupAmt(A.amt);
  var cls = A.amt === "" ? "z" : (A.kind === "expense" ? "exp" : "inc");

  var h = "";
  h += '<div class="seg" id="a-seg">' +
       '<button data-k="expense"' + (A.kind==="expense"?' class="on"':"") + ">Расход</button>" +
       '<button data-k="income"'  + (A.kind==="income" ?' class="on"':"") + ">Доход</button></div>";

  h += '<div class="amt ' + cls + '">' + esc(disp) + "<em>" + esc(symbol()) + "</em></div>";

  h += '<div class="meta">' +
       '<input type="date" id="a-date" value="' + A.date + '">' +
       '<input id="a-note" placeholder="заметка" value="' + esc(A.note) + '" maxlength="60">' +
       "</div>";

  h += '<div class="cats" id="a-cats">';
  cats.forEach(function(c){
    h += '<button class="cat' + (c.id===A.cat?" on":"") + '" data-c="' + c.id + '" ' +
         'style="--pick:' + c.color + (c.id===A.cat ? ";background:" + c.color + "14" : "") + '">' +
         '<span class="e">' + c.emoji + '</span><span class="n">' + esc(c.name) + "</span></button>";
  });
  h += '<button class="cat add" data-c="__new">' +
       '<span class="e">' + IC.plus + '</span><span class="n">Новая</span></button>';
  h += "</div>";

  /* Клавиатура: цифры 1–9 занимают три колонки, кнопка сохранения —
     высокий блок в четвёртой, ноль растянут на две ячейки. */
  h += '<div class="pad" id="a-pad">';
  ["1","2","3","⌫","4","5","6"].forEach(function(k){
    h += '<button data-k="' + k + '">' + (k === "⌫" ? IC.back : k) + "</button>";
  });
  h += '<button class="ksave" id="a-save"' + (A.amt === "" || !A.cat ? " disabled" : "") + ">" +
       IC.check + "<span>Сохранить</span></button>";
  ["7","8","9",","].forEach(function(k){
    h += '<button data-k="' + k + '">' + k + "</button>";
  });
  h += '<button class="k0" data-k="0">0</button>';
  h += "</div>";

  el("t-add").innerHTML = h;

  el("a-seg").onclick = function(e){
    var b = e.target.closest("button[data-k]"); if (!b) return;
    A.kind = b.dataset.k; A.cat = null; renderAdd();
  };

  el("a-pad").onclick = function(e){
    var b = e.target.closest("button[data-k]"); if (!b) return;
    key(b.dataset.k);
  };

  el("a-date").onchange = function(){ A.date = this.value || today(); };
  el("a-note").oninput = function(){ A.note = this.value; };

  el("a-cats").onclick = function(e){
    var b = e.target.closest("button[data-c]"); if (!b) return;
    if (b.dataset.c === "__new") { editCategory(null, A.kind); return; }
    A.cat = (A.cat === b.dataset.c) ? null : b.dataset.c;
    renderAdd();
  };

  el("a-save").onclick = saveTx;
}

function key(k){
  if (k === "⌫") {
    A.amt = A.amt.slice(0,-1);
  } else if (k === ",") {
    if (A.amt === "") A.amt = "0,";
    else if (A.amt.indexOf(",") === -1) A.amt += ",";
  } else {
    if (A.amt === "0") A.amt = "";
    var dot = A.amt.indexOf(",");
    if (dot > -1 && A.amt.length - dot > 2) return;
    if (A.amt.replace(",","").length >= 12) return;
    A.amt += k;
  }
  renderAdd();
}

function parseAmt(s){
  var v = parseFloat(String(s).replace(",", ".").replace(/\s/g,""));
  return isNaN(v) ? 0 : Math.round(v*100)/100;
}

function saveTx(){
  var v = parseAmt(A.amt);
  if (v <= 0) { toast("Введите сумму"); return; }
  if (!A.cat) { toast("Выберите категорию"); return; }
  S.tx.push({ id: uid(), amount: v, categoryId: A.cat, kind: A.kind,
              date: A.date, note: A.note.trim(), createdAt: Date.now() });
  saveState();
  var name = catById(A.cat).name;
  A.amt = ""; A.note = "";
  renderAdd();
  toast((A.kind === "expense" ? "− " : "+ ") + fmt(v) + " · " + name);
}

/* ---------- Вкладка «Месяц» ---------- */

var view = monthOf(today());

function renderMonth(){
  var list = txOfMonth(view);
  var exps = list.filter(function(t){ return t.kind === "expense"; });
  var incs = list.filter(function(t){ return t.kind === "income"; });
  var eSum = sum(exps), iSum = sum(incs), bal = iSum - eSum;

  var h = '<div class="nav2">' +
    '<button id="m-prev">' + IC.chevL + '</button><b>' + monthTitle(view) + "</b>" +
    '<button id="m-next"' + (view >= monthOf(today()) ? " disabled" : "") + ">" + IC.chev + "</button></div>";

  h += '<div class="card"><div class="tot">' +
    '<div><span>Доходы</span><b style="color:var(--green)">' + fmt(iSum) + "</b></div>" +
    '<div><span>Расходы</span><b style="color:var(--red)">' + fmt(eSum) + "</b></div>" +
    '<div><span>Баланс</span><b style="color:' + (bal < 0 ? "var(--red)" : "var(--tx)") + '">' +
      (bal > 0 ? "+" : "") + fmt(bal) + "</b></div>" +
    "</div>";

  if (S.totalLimit > 0) {
    var p = Math.min(100, eSum / S.totalLimit * 100);
    var over = eSum > S.totalLimit;
    h += '<div style="padding:12px 0 4px;border-top:.5px solid var(--sep);margin-top:12px">' +
      '<div style="display:flex;justify-content:space-between;font:500 13px var(--f)">' +
      "<span>Лимит на месяц</span><span style=\"color:" + (over ? "var(--red)" : "var(--mut)") + '">' +
      fmt(eSum) + " / " + fmt(S.totalLimit) + "</span></div>" +
      '<div class="bar"><i style="width:' + p + "%;background:" +
      (over ? "var(--red)" : p > 80 ? "#ff9500" : "var(--green)") + '"></i></div>' +
      '<div style="font:400 12px var(--f);color:' + (over ? "var(--red)" : "var(--mut)") + ';margin-top:6px">' +
      (over ? "Перерасход " + fmt(eSum - S.totalLimit) : "Осталось " + fmt(S.totalLimit - eSum)) +
      "</div></div>";
  }
  h += "</div>";

  if (!list.length) {
    h += '<div class="empty"><span class="e">🗓</span>За этот месяц записей нет.<br>' +
         "Добавьте первую на вкладке «Добавить».</div>";
    el("t-month").innerHTML = h;
    bindMonthNav();
    return;
  }

  /* --- разбивка по категориям --- */
  var groups = {};
  exps.forEach(function(t){
    if (!groups[t.categoryId]) groups[t.categoryId] = 0;
    groups[t.categoryId] += t.amount;
  });
  var rows = Object.keys(groups).map(function(id){
    var c = catById(id) || { name:"Удалённая категория", emoji:"❓", color:"#8e8e93", limit:null };
    return { c:c, v:groups[id] };
  }).sort(function(a,b){ return b.v - a.v; });

  if (rows.length) {
    h += '<div class="sec">Расходы по категориям</div><div class="card">';
    h += donut(rows, eSum);
    rows.forEach(function(r){
      var pct = eSum ? Math.round(r.v / eSum * 100) : 0;
      h += '<div class="row"><span class="e" style="background:' + r.c.color + '26">' + r.c.emoji + "</span>" +
           '<div class="t"><b>' + esc(r.c.name) + "</b>";
      if (r.c.limit > 0) {
        var lp = Math.min(100, r.v / r.c.limit * 100), lo = r.v > r.c.limit;
        h += '<div class="bar" style="margin-top:5px"><i style="width:' + lp + "%;background:" +
             (lo ? "var(--red)" : r.c.color) + '"></i></div>' +
             '<small class="lim" style="margin-top:5px;color:' + (lo ? "var(--red)" : "var(--mut)") + '">' +
             (lo ? "перерасход " + fmt(r.v - r.c.limit) : "лимит " + fmt(r.c.limit) +
                   ", осталось " + fmt(r.c.limit - r.v)) + "</small>";
      }
      h += '</div><span class="v">' + fmt(r.v) + "<small>" + pct + " %</small></span></div>";
    });
    h += "</div>";
  }

  /* --- доходы по категориям --- */
  if (incs.length) {
    var ig = {};
    incs.forEach(function(t){ ig[t.categoryId] = (ig[t.categoryId] || 0) + t.amount; });
    h += '<div class="sec">Доходы по категориям</div><div class="card">';
    Object.keys(ig).sort(function(a,b){ return ig[b] - ig[a]; }).forEach(function(id){
      var c = catById(id) || { name:"Удалённая категория", emoji:"❓", color:"#8e8e93" };
      h += '<div class="row"><span class="e" style="background:' + c.color + '26">' + c.emoji + "</span>" +
           '<div class="t"><b>' + esc(c.name) + '</b></div>' +
           '<span class="v" style="color:var(--green)">' + fmt(ig[id]) + "</span></div>";
    });
    h += "</div>";
  }

  /* --- операции --- */
  h += '<div class="sec">Операции · ' + list.length + "</div>";
  var byDay = {};
  list.forEach(function(t){ (byDay[t.date] = byDay[t.date] || []).push(t); });
  Object.keys(byDay).sort().reverse().forEach(function(d){
    var day = byDay[d].slice().sort(function(a,b){ return b.createdAt - a.createdAt; });
    var dTot = day.reduce(function(a,t){ return a + (t.kind === "expense" ? -t.amount : t.amount); }, 0);
    h += '<div style="display:flex;justify-content:space-between;font:500 13px var(--f);' +
         'color:var(--mut);margin:14px 6px 6px"><span>' + dayTitle(d) + "</span><span>" +
         (dTot > 0 ? "+" : "") + fmt(dTot) + "</span></div>";
    h += '<div class="card" style="padding:2px 16px">';
    day.forEach(function(t){
      var c = catById(t.categoryId) || { name:"Удалённая категория", emoji:"❓", color:"#8e8e93" };
      h += '<button class="row" data-tx="' + t.id + '">' +
           '<span class="e" style="background:' + c.color + '26">' + c.emoji + "</span>" +
           '<div class="t"><b>' + esc(c.name) + "</b>" +
           (t.note ? "<small>" + esc(t.note) + "</small>" : "") + "</div>" +
           '<span class="v" style="color:' + (t.kind === "expense" ? "var(--tx)" : "var(--green)") + '">' +
           (t.kind === "expense" ? "−" : "+") + " " + fmt(t.amount) + "</span>" +
           '<span class="ch">' + IC.chev + '</span></button>';
    });
    h += "</div>";
  });

  el("t-month").innerHTML = h;
  bindMonthNav();

  el("t-month").onclick = function(e){
    var b = e.target.closest("button[data-tx]");
    if (b) editTx(b.dataset.tx);
  };
}

function bindMonthNav(){
  el("m-prev").onclick = function(){ view = shiftMonth(view,-1); renderMonth(); };
  var n = el("m-next");
  if (!n.disabled) n.onclick = function(){ view = shiftMonth(view,1); renderMonth(); };
}

function donut(rows, total){
  if (!total) return "";
  var R = 52, C = 2 * Math.PI * R, off = 0, segs = "";
  rows.forEach(function(r){
    var len = r.v / total * C;
    if (len < 0.6) return;
    segs += '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="' + r.c.color +
            '" stroke-width="16" stroke-dasharray="' + (len - 1.2) + " " + (C - len + 1.2) +
            '" stroke-dashoffset="' + (-off) + '" stroke-linecap="butt"></circle>';
    off += len;
  });
  return '<svg class="donut" width="140" height="140" viewBox="0 0 140 140">' +
    '<g transform="rotate(-90 70 70)">' +
    '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="var(--bar)" stroke-width="16"></circle>' +
    segs + "</g>" +
    '<g class="dc"><text class="a" x="70" y="68">' + fmt(total,false) + "</text>" +
    '<text class="b" x="70" y="86">расходы, ' + esc(symbol()) + "</text></g></svg>";
}

/* ---------- Редактирование операции ---------- */

function editTx(id){
  var t = null;
  for (var i=0;i<S.tx.length;i++) if (S.tx[i].id === id) t = S.tx[i];
  if (!t) return;

  var opts = catsOf(t.kind).map(function(c){
    return '<option value="' + c.id + '"' + (c.id === t.categoryId ? " selected" : "") + ">" +
           c.emoji + " " + esc(c.name) + "</option>";
  }).join("");

  openSheet("Операция",
    '<label class="f"><span>Сумма (' + esc(symbol()) + ')</span>' +
    '<input id="e-amt" type="text" inputmode="decimal" value="' + String(t.amount).replace(".",",") + '"></label>' +
    '<label class="f"><span>Категория</span><select id="e-cat">' + opts + "</select></label>" +
    '<label class="f"><span>Дата</span><input id="e-date" type="date" value="' + t.date + '"></label>' +
    '<label class="f"><span>Комментарий</span><input id="e-note" maxlength="60" value="' + esc(t.note || "") + '"></label>' +
    '<button class="btn" id="e-ok">Сохранить</button>' +
    '<button class="btn r" id="e-del">Удалить операцию</button>' +
    '<button class="btn g" id="e-no">Отмена</button>',
    function(ov){
      ov.querySelector("#e-ok").onclick = function(){
        var v = parseAmt(ov.querySelector("#e-amt").value);
        if (v <= 0) { toast("Введите сумму"); return; }
        t.amount = v;
        t.categoryId = ov.querySelector("#e-cat").value;
        t.date = ov.querySelector("#e-date").value || t.date;
        t.note = ov.querySelector("#e-note").value.trim();
        saveState(); closeSheet(); renderMonth(); toast("Сохранено");
      };
      ov.querySelector("#e-del").onclick = function(){
        closeSheet();
        confirmSheet("Удалить операцию?", fmt(t.amount) + " · " +
          ((catById(t.categoryId) || {}).name || "категория удалена"),
          "Удалить", true, function(){
            S.tx = S.tx.filter(function(x){ return x.id !== id; });
            saveState(); renderMonth(); toast("Операция удалена");
          });
      };
      ov.querySelector("#e-no").onclick = closeSheet;
    });
}

function editCategory(id, kind){
  var c = id ? catById(id) : null;
  var isNew = !c;
  var draft = c ? { name:c.name, emoji:c.emoji, color:c.color, kind:c.kind, limit:c.limit }
                : { name:"", emoji:"📦", color:PAL[Math.floor(Math.random()*PAL.length)],
                    kind: kind || "expense", limit:null };

  var h = "";
  h += '<label class="f"><span>Название</span>' +
       '<input id="c-name" maxlength="28" placeholder="Например: Продукты" value="' + esc(draft.name) + '"></label>';
  h += '<label class="f"><span>Значок</span></label><div class="emo" id="c-emo">';
  EMO.forEach(function(e){
    h += '<button data-e="' + e + '"' + (e === draft.emoji ? ' class="on"' : "") + ">" + e + "</button>";
  });
  h += "</div>";
  h += '<label class="f" style="margin-top:12px"><span>Или введите свой значок</span>' +
       '<input id="c-emoji" maxlength="4" value="' + esc(draft.emoji) + '" style="text-align:center;font-size:24px"></label>';
  h += '<label class="f"><span>Цвет</span></label><div class="cols" id="c-col">';
  PAL.forEach(function(p){
    h += '<button data-p="' + p + '" style="background:' + p + '"' +
         (p === draft.color ? ' class="on"' : "") + "></button>";
  });
  h += "</div>";
  if (draft.kind === "expense") {
    h += '<label class="f" style="margin-top:14px"><span>Лимит на месяц, ' + esc(symbol()) +
         " (пусто — без лимита)</span>" +
         '<input id="c-lim" type="text" inputmode="decimal" placeholder="без лимита" value="' +
         (draft.limit > 0 ? String(draft.limit).replace(".",",") : "") + '"></label>';
  }
  h += '<button class="btn" id="c-ok">' + (isNew ? "Создать" : "Сохранить") + "</button>";
  if (!isNew) h += '<button class="btn r" id="c-del">Удалить категорию</button>';
  h += '<button class="btn g" id="c-no">Отмена</button>';

  openSheet(isNew ? (draft.kind === "expense" ? "Новая категория расхода" : "Новая категория дохода")
                  : "Категория", h,
    function(ov){
      var emojiInput = ov.querySelector("#c-emoji");
      ov.querySelector("#c-emo").onclick = function(e){
        var b = e.target.closest("button[data-e]"); if (!b) return;
        draft.emoji = b.dataset.e;
        emojiInput.value = draft.emoji;
        ov.querySelectorAll("#c-emo button").forEach(function(x){ x.classList.remove("on"); });
        b.classList.add("on");
      };
      emojiInput.oninput = function(){ draft.emoji = this.value; };
      ov.querySelector("#c-col").onclick = function(e){
        var b = e.target.closest("button[data-p]"); if (!b) return;
        draft.color = b.dataset.p;
        ov.querySelectorAll("#c-col button").forEach(function(x){ x.classList.remove("on"); });
        b.classList.add("on");
      };
      ov.querySelector("#c-ok").onclick = function(){
        var name = ov.querySelector("#c-name").value.trim();
        if (!name) { toast("Введите название"); return; }
        var emo = emojiInput.value.trim() || "📦";
        var lim = null;
        var li = ov.querySelector("#c-lim");
        if (li && li.value.trim()) { lim = parseAmt(li.value); if (lim <= 0) lim = null; }
        if (isNew) {
          var nc = { id: uid(), name:name, emoji:emo, color:draft.color, kind:draft.kind, limit:lim };
          S.categories.push(nc);
          if (A.kind === nc.kind) A.cat = nc.id;
        } else {
          c.name = name; c.emoji = emo; c.color = draft.color; c.limit = lim;
        }
        saveState(); closeSheet(); renderAll();
        toast(isNew ? "Категория создана" : "Сохранено");
      };
      if (!isNew) ov.querySelector("#c-del").onclick = function(){
        closeSheet(); deleteCategory(c);
      };
      ov.querySelector("#c-no").onclick = closeSheet;
    });
}

function deleteCategory(c){
  var used = S.tx.filter(function(t){ return t.categoryId === c.id; });
  var same = catsOf(c.kind).filter(function(x){ return x.id !== c.id; });
  if (!same.length) { toast("Нельзя удалить последнюю категорию"); return; }

  var fallback = null;
  for (var i=0;i<same.length;i++) if (same[i].name === "Прочее") fallback = same[i];
  if (!fallback) fallback = same[same.length-1];

  var text = used.length
    ? "По этой категории есть операций: " + used.length + ". Они будут перенесены в «" +
      fallback.name + "», суммы сохранятся."
    : "Операций по этой категории нет.";

  confirmSheet("Удалить «" + c.name + "»?", text, "Удалить", true, function(){
    S.tx.forEach(function(t){ if (t.categoryId === c.id) t.categoryId = fallback.id; });
    S.categories = S.categories.filter(function(x){ return x.id !== c.id; });
    if (A.cat === c.id) A.cat = null;
    saveState(); renderAll(); toast("Категория удалена");
  });
}

/* ---------- Экспорт / импорт ---------- */

function csvCell(v){
  var s = String(v == null ? "" : v);
  return /[";\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}

function exportCsv(mk){
  var list = mk ? txOfMonth(mk) : S.tx.slice();
  if (!list.length) { toast("Нет операций для экспорта"); return; }
  list.sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : a.createdAt - b.createdAt; });

  var lines = ["дата;тип;категория;сумма;валюта;комментарий"];
  list.forEach(function(t){
    var c = catById(t.categoryId);
    lines.push([
      csvCell(t.date),
      t.kind === "expense" ? "расход" : "доход",
      csvCell(c ? c.name : "Удалённая категория"),
      csvCell(String(t.amount).replace(".", ",")),
      csvCell(symbol()),
      csvCell(t.note || "")
    ].join(";"));
  });
  var name = "финансы-" + (mk || "все") + ".csv";
  share(name, "\uFEFF" + lines.join("\r\n"), "text/csv");
}

function exportJson(){
  var name = "финансы-копия-" + today() + ".json";
  share(name, JSON.stringify(S), "application/json");
}

function share(name, text, mime){
  var done = false;
  try {
    var f = new File([text], name, { type: mime });
    if (navigator.canShare && navigator.canShare({ files:[f] })) {
      done = true;
      navigator.share({ files:[f] }).catch(function(){ textSheet(name, text); });
    }
  } catch(e){}
  if (!done) textSheet(name, text);
}

function textSheet(name, text){
  openSheet(name,
    '<div class="hint" style="padding:0 4px 12px">Поделиться файлом не удалось. ' +
    "Скопируйте текст ниже и сохраните его в «Заметки» или отправьте себе в мессенджер.</div>" +
    '<textarea id="x-t" readonly>' + esc(text) + "</textarea>" +
    '<div style="height:12px"></div>' +
    '<button class="btn" id="x-c">Скопировать</button>' +
    '<button class="btn g" id="x-n">Закрыть</button>',
    function(ov){
      ov.querySelector("#x-c").onclick = function(){
        var ta = ov.querySelector("#x-t");
        ta.focus(); ta.setSelectionRange(0, ta.value.length);
        var ok = false;
        try { ok = document.execCommand("copy"); } catch(e){}
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(function(){ toast("Скопировано"); },
          function(){ if (!ok) toast("Скопируйте вручную"); });
        else toast(ok ? "Скопировано" : "Скопируйте вручную");
      };
      ov.querySelector("#x-n").onclick = closeSheet;
    });
}

function importSheet(){
  openSheet("Восстановить из копии",
    '<div class="hint" style="padding:0 4px 12px">Вставьте содержимое файла резервной копии (JSON). ' +
    "Текущие данные будут полностью заменены.</div>" +
    '<textarea id="i-t" placeholder="{&quot;version&quot;:1, ...}"></textarea>' +
    '<div style="height:12px"></div>' +
    '<button class="btn" id="i-ok">Восстановить</button>' +
    '<button class="btn g" id="i-no">Отмена</button>',
    function(ov){
      ov.querySelector("#i-ok").onclick = function(){
        var raw = ov.querySelector("#i-t").value.trim();
        var data;
        try { data = JSON.parse(raw); } catch(e){ toast("Это не похоже на JSON"); return; }
        if (!data || !Array.isArray(data.categories) || !Array.isArray(data.tx)) {
          toast("В файле нет данных приложения"); return;
        }
        closeSheet();
        confirmSheet("Заменить данные?",
          "В копии: " + data.tx.length + " операций и " + data.categories.length +
          " категорий. Текущие " + S.tx.length + " операций будут удалены.",
          "Восстановить", true, function(){
            S = data;
            if (!S.currency) S.currency = "UAH";
            if (typeof S.totalLimit === "undefined") S.totalLimit = null;
            saveState();
            view = monthOf(today()); A = { kind:"expense", amt:"", cat:null, date:today(), note:"" };
            renderAll(); toast("Данные восстановлены");
          });
      };
      ov.querySelector("#i-no").onclick = closeSheet;
    });
}

function go(t){

  ["add","month","cats","set"].forEach(function(x){
    el("t-" + x).classList.toggle("on", x === t);
  });
  document.querySelectorAll("#nav button").forEach(function(b){

  if (t === "month") { view = monthOf(today()); renderMonth(); }
  if (t === "set") renderSet();
  el("main").scrollTop = 0;
}

el("nav").onclick = function(e){
  var b = e.target.closest("button[data-t]"); if (!b) return;
  go(b.dataset.t);
};

/* ---------- Старт ---------- */

S = loadState();
saveState();
renderAll();
go("add");
</script>
