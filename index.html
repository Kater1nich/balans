6RxuH60qYhSdxyoOnqjYuzx/QJOCLoNoJeQmufY0ClIeg2gl5B90uJEZWEoNsIOoOmyvqOqXeFoNsIOpNmHHT/kxjUPulNxlZgbQTdk6bocn982RaFrPE9K/+6CHpNGoZoJmOo21OsoufR82mIwVXnixH0APSpfe320aCf3NqZSUMcfSnVcCc+J9IIegsUoD7BNcesKOPN5iPNQ+uxOmZbvzpOBUHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDCkHDyn+LG5e4Sdy0GwAAAABJRU5ErkJggg==">
<style>
/* Приложение сознательно одно-темовое: тёмный финтех.
   Светлой темы нет, поэтому каждый цвет задан явно и не зависит
   от темы устройства — страница выглядит одинаково везде. */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#0b0c0f;--surface:#15171c;--surface2:#1d2027;--line:#262a33;
--tx:#f2f4f7;--mut:#7e8593;
--acc:#c6f24e;--accfg:#0b0c0f;--acct:rgba(198,242,78,.13);
--red:#ff6b6b;--redt:rgba(255,107,107,.13);
--f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
color-scheme:dark
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);overscroll-behavior:none;
font:400 17px/1.35 var(--f);-webkit-user-select:none;user-select:none;
-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100dvh}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
padding:calc(10px + env(safe-area-inset-top)) 20px 28px}
.tab{display:none}
.tab.on{display:block;animation:fade .18s}
@keyframes fade{from{opacity:0}}

/* Главный экран живёт без прокрутки: тянется только сетка категорий. */
main.fixed{overflow:hidden;padding-bottom:0;display:flex;flex-direction:column}
main.fixed .tab.on{flex:1;min-height:0;display:flex;flex-direction:column;animation:none}

/* ---- нижняя панель ---- */
/* Полная безопасная зона (34pt) поднимала панель слишком высоко над
   «домашней полосой». Оставляем ровно столько, чтобы её не задевать. */
nav{display:flex;background:rgba(11,12,15,.92);-webkit-backdrop-filter:blur(20px);
backdrop-filter:blur(20px);border-top:1px solid var(--line);
padding-bottom:max(6px,calc(env(safe-area-inset-bottom) - 17px));flex:none}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 0 7px;
display:flex;flex-direction:column;align-items:center;gap:4px;
font:500 10px/1 var(--f);letter-spacing:.2px;transition:color .15s}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--acc)}

/* ---- типографика ---- */
h1{font:300 34px/1.1 var(--f);letter-spacing:-1px;margin:6px 0 22px}
.sec{font:500 11px/1 var(--f);color:var(--mut);text-transform:uppercase;
letter-spacing:1px;margin:26px 2px 10px}
.hint{font:400 13px/1.5 var(--f);color:var(--mut);padding:2px 2px 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;
padding:14px 16px;margin-bottom:12px}

/* ---- герой месяца: крупный тонкий баланс ---- */
.hero{padding:2px 2px 4px}
.hero .big{font:300 56px/1 var(--f);letter-spacing:-3px;
font-variant-numeric:tabular-nums;word-break:break-all}
.hero .big.neg{color:var(--red)}
.hero .cap{font:400 13px var(--f);color:var(--mut);margin-top:10px;letter-spacing:.2px}
.chips{display:flex;gap:9px;margin-top:18px}
.chip{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);
border-radius:16px;padding:13px 14px}
.chip span{display:block;font:500 10px/1 var(--f);color:var(--mut);
text-transform:uppercase;letter-spacing:.9px;margin-bottom:8px}
.chip b{font:500 18px/1 var(--f);letter-spacing:-.4px;
font-variant-numeric:tabular-nums;display:block}
.chip b.inc{color:var(--acc)}

/* ---- сравнение с прошлым месяцем ---- */
.cmp{font:500 13px var(--f);color:var(--mut);margin-top:9px;letter-spacing:.2px}
.cmp.up{color:var(--red)}
.cmp.down{color:var(--acc)}

/* ---- график трат по дням ---- */
.days{display:flex;align-items:flex-end;gap:2px;height:72px}
.dbar{flex:1;min-width:0;height:100%;background:none;border:0;padding:0;
display:flex;align-items:flex-end}
.dbar i{display:block;width:100%;height:var(--hh);min-height:2px;
background:var(--surface2);border-radius:2px}
.dbar.zero i{height:2px;background:var(--line)}
.dbar.top i{background:var(--acc)}
.dbar:active i{background:var(--mut)}
.dmarks{display:flex;justify-content:space-between;margin-top:8px;
font:400 11px var(--f);color:var(--mut);font-variant-numeric:tabular-nums}

/* ---- напоминание о резервной копии ---- */
.nudge b{display:block;font:500 16px var(--f);margin-bottom:6px}
.nudge p{font:400 13px/1.5 var(--f);color:var(--mut);margin-bottom:14px}
.nrow{display:flex;gap:9px}
.nrow .btn{margin:0;padding:12px;font-size:14px}

/* ---- стопка расходов вместо кольца ---- */
.stack{display:flex;gap:2px;height:10px;margin:2px 0 18px;
background:var(--surface2);border-radius:5px;overflow:hidden}
.stack i{display:block;height:100%;min-width:3px;border-radius:2px}

/* ---- переключатель расход/доход ---- */
.seg{display:flex;gap:4px;flex:none;background:var(--surface);
border:1px solid var(--line);border-radius:14px;padding:4px;margin:2px 0 0}
.seg button{flex:1;background:none;border:0;border-radius:11px;color:var(--mut);
font:500 14px/1 var(--f);padding:11px 0;letter-spacing:.1px;
transition:background .15s,color .15s}
/* Начертание одинаковое в обоих состояниях: при 600 у активной текст
   становился шире и «прыгал» при переключении. Активность несёт заливка. */
.seg .sx.on{background:var(--surface2);color:var(--tx)}
.seg .si.on{background:var(--acc);color:var(--accfg)}

/* ---- сумма: обычное поле, по тапу открывает клавиатуру устройства ---- */
/* auto-поля по вертикали: свободное место экрана достаётся сумме,
   поэтому на большом телефоне число «дышит», а на маленьком поджимается. */
.amtbox{flex:0 0 auto;margin:auto 0;display:flex;align-items:baseline;
justify-content:center;gap:10px;padding:24px 0;position:relative}
#a-amt{background:none;border:0;box-shadow:none;border-radius:0;padding:0;
width:auto;min-width:2ch;text-align:center;caret-color:var(--acc);
font:300 54px/1.1 var(--f);letter-spacing:-3px;color:var(--tx);
font-variant-numeric:tabular-nums}
/* Невидимый двойник поля: по его ширине выставляем ширину ввода.
   Меряем настоящим шрифтом со всеми трекингами — canvas этого не умеет
   и ошибался на несколько пикселей, из-за чего обрезалась последняя цифра. */
.amtmirror{position:absolute;left:-9999px;top:0;visibility:hidden;
white-space:pre;padding:0;border:0;
font:300 54px/1.1 var(--f);letter-spacing:-3px;font-variant-numeric:tabular-nums}
#a-amt:focus{outline:none}
#a-amt::placeholder{color:var(--mut);opacity:1}
.amtbox.inc #a-amt{color:var(--acc)}
.amtbox .cur{font:400 22px var(--f);color:var(--mut);flex:none}
.done{position:absolute;right:0;top:50%;transform:translateY(-50%);
background:var(--surface2);border:0;border-radius:10px;color:var(--tx);
font:500 13px var(--f);padding:9px 13px;visibility:hidden}
.amtbox:focus-within .done{visibility:visible}

/* ---- дата и заметка: две плашки вместо голой строки ---- */
.meta{display:flex;align-items:stretch;gap:8px;flex:0 0 auto}
.mchip{position:relative;display:flex;align-items:center;gap:9px;
background:var(--surface);border:1px solid var(--line);border-radius:14px;
padding:0 14px;min-height:46px;transition:border-color .15s;
font:inherit;color:var(--tx);text-align:left;-webkit-appearance:none;appearance:none}
.mdate:active{background:var(--surface2)}
.mchip>svg{width:16px;height:16px;color:var(--mut);flex:none}
.mdate{flex:none}
.mdate b{font:500 14px var(--f);color:var(--tx);white-space:nowrap}
/* Поле даты невидимо и не ловит нажатия: у системного input[type=date] на iOS
   срабатывает не вся площадь. Нажатия принимает вся плашка, а календарь
   открываем сами через showPicker(). Поле лежит внутри плашки, чтобы
   всплывающий выбор даты появлялся рядом с ней. */
.mdate input{position:absolute;inset:0;width:100%;height:100%;opacity:0;
pointer-events:none;padding:0;margin:0;border:0;background:none;border-radius:14px}
.mnote{flex:1;min-width:0}
.mnote input{background:none;border:0;border-radius:0;padding:0;box-shadow:none;
font:400 14px var(--f);color:var(--tx);width:100%}
.mnote input:focus{outline:none}
.mnote input::placeholder{color:var(--mut);opacity:1}
.mnote:focus-within{border-color:var(--acc)}

/* ---- лента шаблонов ---- */
.tpls{display:flex;gap:7px;flex:0 0 auto;overflow-x:auto;padding:14px 0 0;
-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tpls::-webkit-scrollbar{display:none}
.tpl{flex:none;display:flex;align-items:center;gap:7px;background:var(--surface);
border:1px solid var(--line);border-radius:13px;padding:0 13px;height:42px;
color:var(--tx);font:500 13px var(--f);white-space:nowrap}
.tpl .te{font-size:15px;line-height:1}
.tpl i{font-style:normal;color:var(--mut);font-variant-numeric:tabular-nums}
.tpl:active{background:var(--surface2)}
.tpl.add{padding:0 12px;color:var(--mut)}
.tpl.add svg{width:18px;height:18px}

/* ---- плитки категорий: только основные, остальные под кнопкой «Все» ---- */
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;
flex:0 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
overscroll-behavior:contain;align-content:start;padding:15px 0}
.cats.all{max-height:52dvh;padding:0;flex:none}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:16px;
padding:10px 3px;display:flex;flex-direction:column;align-items:center;gap:7px;
color:var(--mut);font:500 10.5px/1.2 var(--f);text-align:center;height:74px;
justify-content:center;transition:border-color .12s,background .12s,color .12s}
.cat .e{font-size:22px;line-height:1}
.cat .n{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
overflow:hidden;width:100%;word-break:break-word}
.cat.on{border-color:var(--pick);color:var(--tx);box-shadow:inset 0 0 0 1px var(--pick)}
.cat.add{color:var(--mut)}
.cat.add .e{display:grid;place-items:center}
.cat.add svg{width:22px;height:22px}

/* ---- кнопка сохранения и лента последних операций под ней ---- */
.foot{flex:0 0 auto;margin:0 -20px;padding:12px 20px 0;
border-top:1px solid var(--line);background:var(--bg)}
.foot .btn{margin:0}
/* Место под подсказку зарезервировано всегда, поэтому кнопка не прыгает. */
.fbhint{min-height:22px;padding:0 0 8px;text-align:center;
font:400 12px var(--f);color:var(--mut)}
/* Безопасную зону снизу учитывает панель вкладок, лента её добавлять
   не должна — иначе над панелью повисает пустая полоса в 34px. */
.recent{flex:0 0 auto;padding:16px 0 12px}
.rhead{font:500 10px/1 var(--f);color:var(--mut);text-transform:uppercase;
letter-spacing:1px;margin:0 2px 4px}
.rrow{display:flex;align-items:center;gap:11px;width:100%;background:none;
border:0;padding:9px 0;color:var(--tx);text-align:left;font:inherit}
.rrow .e{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;
font-size:15px;flex:none}
.rrow .t{flex:1;min-width:0;font:400 14px var(--f);
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .t i{font-style:normal;color:var(--mut)}
.rrow .v{font:500 14px var(--f);white-space:nowrap;font-variant-numeric:tabular-nums}
.rrow .v.inc{color:var(--acc)}
.rempty{font:400 13px var(--f);color:var(--mut);padding:8px 2px}

/* ---- списки ---- */
.row{display:flex;align-items:center;gap:13px;padding:12px 0;border:0;
border-bottom:1px solid var(--line);width:100%;background:none;color:var(--tx);
text-align:left;font:inherit}
.row:last-child{border-bottom:0}
.row .e{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;
font-size:18px;flex:none}
.row .t{flex:1;min-width:0}
.row .t b{font:500 16px/1.25 var(--f);display:block;overflow:hidden;
text-overflow:ellipsis;white-space:nowrap}
.row .t small{font:400 13px/1.3 var(--f);color:var(--mut);display:block;margin-top:2px;
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small.lim{white-space:normal;overflow:visible}
.row .v{font:500 16px var(--f);white-space:nowrap;text-align:right;
font-variant-numeric:tabular-nums}
.row .v.inc{color:var(--acc)}
.row .v small{display:block;font:400 12px var(--f);color:var(--mut);margin-top:3px}
.row .ch{color:var(--mut);flex:none;display:grid;place-items:center}
.row .ch svg{width:16px;height:16px}

/* ---- полосы лимитов ---- */
.bar{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;border-radius:3px;transition:width .3s}

/* ---- переключатель месяца ---- */
.nav2{display:flex;align-items:center;justify-content:space-between;margin:4px 0 20px}
.nav2 b{font:500 17px var(--f);letter-spacing:-.2px}
.nav2 button{background:var(--surface);border:1px solid var(--line);color:var(--tx);
width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.nav2 button svg{width:15px;height:15px}
.nav2 button:disabled{opacity:.3}

/* ---- кнопки ---- */
.btn{display:block;width:100%;border:1px solid var(--acc);border-radius:15px;
padding:16px;font:600 16px var(--f);background:var(--acc);color:var(--accfg);
margin-bottom:10px;letter-spacing:.1px}
.btn:disabled{opacity:.25}
.btn.g{background:var(--surface);color:var(--tx);border-color:var(--line)}
.btn.r{background:var(--surface);color:var(--red);border-color:var(--line)}
.btn:active{opacity:.7}

.empty{text-align:center;color:var(--mut);font:400 15px/1.55 var(--f);padding:48px 20px}
.empty .e{font-size:36px;display:block;margin-bottom:14px}

/* ---- шторки ---- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;
z-index:200;animation:fade .2s}
.sheet{width:100%;background:var(--bg);border-top:1px solid var(--line);
border-radius:24px 24px 0 0;padding:6px 20px calc(20px + env(safe-area-inset-bottom));
max-height:90dvh;overflow-y:auto;animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:36px;height:4px;background:var(--line);border-radius:2px;margin:8px auto 18px}
.sheet h3{font:500 18px var(--f);text-align:center;margin-bottom:20px}

/* ---- поля ввода ---- */
label.f{display:block;margin-bottom:13px}
label.f>span{display:block;font:500 10px var(--f);color:var(--mut);
text-transform:uppercase;letter-spacing:.9px;margin:0 0 8px 2px}
input,textarea,select{font:400 16px var(--f);color:var(--tx);background:var(--surface);
border:1px solid var(--line);border-radius:13px;padding:13px 14px;width:100%;
-webkit-appearance:none;appearance:none;-webkit-user-select:text;user-select:text}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc)}
input[type=date]{min-height:48px}
select{padding-right:36px;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),
linear-gradient(135deg,var(--mut) 50%,transparent 50%);
background-position:calc(100% - 19px) 22px,calc(100% - 14px) 22px;
background-size:5px 5px,5px 5px;background-repeat:no-repeat}
textarea{min-height:130px;font:400 13px/1.45 ui-monospace,Menlo,monospace;resize:none}

/* ---- выбор значка и цвета ---- */
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;
max-height:128px;overflow-y:auto;padding:2px}
.emo button{background:var(--surface);border:1px solid var(--line);border-radius:11px;
font-size:20px;padding:6px 0}
.emo button.on{border-color:var(--acc);background:var(--acct)}
.cols{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;padding:4px 2px 2px}
.cols button{aspect-ratio:1;border-radius:50%;border:0;position:relative}
.cols button.on::after{content:"";position:absolute;inset:-4px;
border:2px solid var(--tx);border-radius:50%}

/* ---- ввод кода: точки и клавиатура ---- */
.pinnote{font:400 13px/1.5 var(--f);color:var(--mut);text-align:center;margin-bottom:18px}
.dots{display:flex;justify-content:center;gap:14px;margin-bottom:26px}
.dots i{width:12px;height:12px;border-radius:50%;background:none;
border:1.5px solid var(--mut);transition:background .15s,border-color .15s}
.dots i.on{background:var(--acc);border-color:var(--acc)}
.dots.bad i{border-color:var(--red)}
.dots.bad i.on{background:var(--red);border-color:var(--red)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:16px}
.pinpad button{background:var(--surface);border:1px solid var(--line);color:var(--tx);
font:400 24px/1 var(--f);height:56px;border-radius:14px;display:grid;place-items:center;
font-variant-numeric:tabular-nums}
.pinpad button:active{background:var(--surface2)}
.pinpad button svg{width:22px;height:22px}

/* ---- экран блокировки ---- */
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;
align-items:center;justify-content:center;padding:24px;
padding-bottom:calc(24px + env(safe-area-inset-bottom));transition:opacity .2s}
#lock.off{opacity:0;pointer-events:none}
.lockbox{width:100%;max-width:320px}
.lockmark{width:56px;height:56px;margin:0 auto 16px;border-radius:16px;
background:var(--acc);color:var(--accfg);display:grid;place-items:center;
font:600 28px var(--f)}
.lockbox h2{font:500 20px var(--f);text-align:center;margin-bottom:8px;letter-spacing:-.3px}
.lkforgot{display:block;width:100%;background:none;border:0;color:var(--mut);
font:400 13px var(--f);padding:10px}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));
transform:translate(-50%,16px);background:var(--acc);color:var(--accfg);
padding:12px 20px;border-radius:13px;font:600 14px var(--f);opacity:0;
pointer-events:none;transition:.25s;z-index:300;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
<main id="main">
<section class="tab on" id="t-add"></section>
<section class="tab" id="t-month"></section>
<section class="tab" id="t-cats"></section>
<section class="tab" id="t-set"></section>
</main>
<nav id="nav">
<button data-t="add" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Добавить</button>
<button data-t="month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M7.5 20v-6.5M12 20V6M16.5 20v-9.5"/></svg>Месяц</button>
<button data-t="cats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>Категории</button>
<button data-t="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h8.6M17.4 8H20M4 16h3.1M11.9 16H20"/><circle cx="15" cy="8" r="2.4"/><circle cx="9.5" cy="16" r="2.4"/></svg>Настройки</button>
</nav>
</div>
<div id="sheets"></div>
<div id="toast"></div>
<script>
"use strict";

/* ---------- Константы ---------- */

var KEY = "budget_v1";

var CUR = [
  ["UAH","₴","Гривна"], ["USD","$","Доллар"], ["EUR","€","Евро"],
  ["PLN","zł","Злотый"], ["CZK","Kč","Крона"]
];

var PAL = ["#ff3b30","#ff9500","#ffcc00","#34c759","#00c7be","#30b0c7","#007aff","#5856d6",
           "#af52de","#ff2d55","#a2845e","#8e8e93"];

var EMO = ["🛒","🍽","☕️","🍕","🚌","🚗","⛽️","✈️","🏠","💡","🧾","🛠","💊","🏥","🦷","🧴",
           "👕","👟","👜","💅","🎬","🎮","🎧","🎉","👶","🧸","🎁","🐾","📚","🎓","✏️","💻",
           "📱","📶","🏋️","⚽️","🚴","🏖","🍺","🚬","💳","🏦","💼","💰","📈","🔄","🤝","⭐️"];

/* Иконки интерфейса. Наследуют цвет от родителя через currentColor,
   поэтому активное состояние вкладок и кнопок работает само. */
function svg(body, w){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' +
         (w || 1.7) + '" stroke-linecap="round" stroke-linejoin="round">' + body + "</svg>";
}

var IC = {
  plus:  svg('<path d="M12 5v14M5 12h14"/>'),
  chev:  svg('<path d="M9 5l7 7-7 7"/>', 2),
  chevL: svg('<path d="M15 5l-7 7 7 7"/>', 2),
  check: svg('<path d="M4.5 12.5l5 5 10-11"/>', 2),
  back:  svg('<path d="M20 5H9.6L3.5 12l6.1 7H20a1.5 1.5 0 0 0 1.5-1.5v-11A1.5 1.5 0 0 0 20 5Z"/>' +
             '<path d="M16.5 9.5l-5 5m0-5 5 5"/>'),
  cal:   svg('<rect x="3.5" y="5.5" width="17" height="15" rx="3.5"/>' +
             '<path d="M8 3v5M16 3v5M3.5 11h17"/>'),
  note:  svg('<path d="M4 20h4L18.4 9.6a2.55 2.55 0 0 0-3.6-3.6L4 16.4V20Z"/>' +
             '<path d="M13.8 7l3.2 3.2"/>'),
  grid:  svg('<rect x="3.5" y="3.5" width="7" height="7" rx="2"/>' +
             '<rect x="13.5" y="3.5" width="7" height="7" rx="2"/>' +
             '<rect x="3.5" y="13.5" width="7" height="7" rx="2"/>' +
             '<rect x="13.5" y="13.5" width="7" height="7" rx="2"/>')
};

var MONTHS  = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
var MONTHS2 = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
var WDAYS   = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];

/* ---------- Утилиты ---------- */

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function el(id){ return document.getElementById(id); }

function pad2(n){ return n < 10 ? "0" + n : "" + n; }

function today(){
  var d = new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
}

function monthOf(iso){ return iso.slice(0,7); }

function monthTitle(mk){
  var p = mk.split("-");
  return MONTHS[parseInt(p[1],10)-1] + " " + p[0];
}

function shiftMonth(mk, delta){
  var p = mk.split("-"), d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1 + delta, 1);
  return d.getFullYear() + "-" + pad2(d.getMonth()+1);
}

/* Короткая подпись даты для плашки: «Сегодня», «Вчера» или «3 июл». */
var MONTHS3 = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];

function dateLabel(iso){
  if (iso === today()) return "Сегодня";
  var y = new Date(); y.setDate(y.getDate() - 1);
  if (iso === y.getFullYear() + "-" + pad2(y.getMonth()+1) + "-" + pad2(y.getDate())) return "Вчера";
  var p = iso.split("-");
  return (+p[2]) + " " + MONTHS3[+p[1]-1] +
         (+p[0] !== new Date().getFullYear() ? " " + p[0] : "");
}

function dayTitle(iso){
  var p = iso.split("-"), d = new Date(+p[0], +p[1]-1, +p[2]);
  var t = today();
  if (iso === t) return "Сегодня";
  var y = new Date(); y.setDate(y.getDate()-1);
  if (iso === y.getFullYear()+"-"+pad2(y.getMonth()+1)+"-"+pad2(y.getDate())) return "Вчера";
  return (+p[2]) + " " + MONTHS2[+p[1]-1] + ", " + WDAYS[d.getDay()];
}

/* ---------- Состояние ---------- */

function defaultCats(){
  var exp = [
    ["Продукты","🛒","#34c759"], ["Кафе и рестораны","🍽","#ff9500"], ["Транспорт","🚌","#007aff"],
    ["Жильё и коммуналка","🏠","#5856d6"], ["Здоровье","💊","#ff2d55"], ["Одежда","👕","#af52de"],
    ["Развлечения","🎬","#ff3b30"], ["Дети","👶","#00c7be"], ["Подарки","🎁","#ffcc00"],
    ["Питомцы","🐾","#a2845e"], ["Образование","📚","#30b0c7"], ["Подписки и связь","📱","#5856d6"],
    ["Техника","💻","#8e8e93"], ["Спорт","🏋️","#34c759"], ["Путешествия","✈️","#007aff"],
    ["Красота","💅","#ff2d55"], ["Авто","🚗","#ff9500"], ["Прочее","📦","#8e8e93"]
  ];
  var inc = [
    ["Зарплата","💼","#34c759"], ["Подработка","🤝","#00c7be"], ["Подарок","🎁","#ffcc00"],
    ["Инвестиции","📈","#007aff"], ["Возврат","🔄","#5856d6"], ["Прочее","📦","#8e8e93"]
  ];
  function mk(arr, kind){
    return arr.map(function(c){
      return { id: uid(), name: c[0], emoji: c[1], color: c[2], kind: kind, limit: null };
    });
  }
  return mk(exp,"expense").concat(mk(inc,"income"));
}

function defaultState(){
  return { version:2, currency:"UAH", symbol:null, totalLimit:null,
           categories: defaultCats(), tx: [],
           templates: [], pin: null, lastBackup: null, backupSnooze: null };
}

var S;

function loadState(){
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return defaultState();
    var s = JSON.parse(raw);
    if (!s || !Array.isArray(s.categories) || !Array.isArray(s.tx)) return defaultState();
    if (!s.currency) s.currency = "UAH";
    if (typeof s.totalLimit === "undefined") s.totalLimit = null;
    /* Валюта из старой версии, которой больше нет в списке: возвращаем
       к гривне, иначе символ молча превратился бы в чужой. */
    if (!s.symbol) {
      var known = false;
      for (var i = 0; i < CUR.length; i++) if (CUR[i][0] === s.currency) known = true;
      if (!known) s.currency = "UAH";
    }
    /* Поля, появившиеся во второй версии: подставляем их старым данным,
       иначе приложение споткнётся на уже сохранённом budget_v1. */
    if (!Array.isArray(s.templates)) s.templates = [];
    if (typeof s.pin === "undefined") s.pin = null;
    if (typeof s.lastBackup === "undefined") s.lastBackup = null;
    if (typeof s.backupSnooze === "undefined") s.backupSnooze = null;
    s.version = 2;
    return s;
  } catch(e){ return defaultState(); }
}

function saveState(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast("Не удалось сохранить данные"); }
}

/* ---------- Деньги ---------- */

function symbol(){
  if (S.symbol) return S.symbol;
  for (var i=0;i<CUR.length;i++) if (CUR[i][0] === S.currency) return CUR[i][1];
  return "₴";
}

/* Что показать в настройках строкой «Валюта». */
function curInfo(){
  if (S.symbol) return { name:"Свой символ", code:"задан вручную" };
  for (var i=0;i<CUR.length;i++)
    if (CUR[i][0] === S.currency) return { name:CUR[i][2], code:CUR[i][0] };
  return { name:CUR[0][2], code:CUR[0][0] };
}

function fmt(n, withSym){
  var abs = Math.abs(n);
  var dec = Math.round(abs*100) % 100 === 0 ? 0 : 2;
  var s = new Intl.NumberFormat("ru-RU", {
    minimumFractionDigits: dec, maximumFractionDigits: dec
  }).format(n);
  return withSym === false ? s : s + " " + symbol();
}

/* ---------- Выборки ---------- */

function catById(id){
  for (var i=0;i<S.categories.length;i++) if (S.categories[i].id === id) return S.categories[i];
  return null;
}

function catsOf(kind){
  return S.categories.filter(function(c){ return c.kind === kind; });
}

function txOfMonth(mk){
  return S.tx.filter(function(t){ return monthOf(t.date) === mk; });
}

function sum(list){
  return list.reduce(function(a,t){ return a + t.amount; }, 0);
}

/* ---------- UI-помощники ---------- */

var toastTimer = null;
function toast(msg){
  var t = el("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("on"); }, 2000);
}

function openSheet(title, html, onMount){
  var ov = document.createElement("div");
  ov.className = "ov";
  ov.innerHTML = '<div class="sheet"><div class="grab"></div>' +
                 (title ? "<h3>" + esc(title) + "</h3>" : "") + html + "</div>";
  ov.addEventListener("click", function(e){ if (e.target === ov) closeSheet(); });
  el("sheets").appendChild(ov);
  if (onMount) onMount(ov);
  return ov;
}

function closeSheet(){
  var s = el("sheets");
  if (s.lastChild) s.removeChild(s.lastChild);
}

function confirmSheet(title, text, okLabel, danger, cb){
  openSheet(title,
    '<p class="hint" style="text-align:center;font-size:15px;padding:0 4px 18px">' + esc(text) + "</p>" +
    '<button class="btn' + (danger ? " r" : "") + '" id="cf-ok">' + esc(okLabel) + "</button>" +
    '<button class="btn g" id="cf-no">Отмена</button>',
    function(ov){
      ov.querySelector("#cf-ok").onclick = function(){ closeSheet(); cb(); };
      ov.querySelector("#cf-no").onclick = closeSheet;
    });
}

/* ---------- Вкладка «Добавить» ---------- */

var A = { kind:"expense", amt:"", cat:null, date:today(), note:"" };

/* Разряды в поле ввода: "1250,5" -> "1 250,5" (дробную часть не трогаем) */
function groupAmt(s){
  var p = s.split(","), i = p[0];
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return p.length > 1 ? i + "," + p[1] : i;
}

/* Приводит всё, что пользователь набрал на системной клавиатуре,
   к виду "1250,5": только цифры, одна запятая, не больше двух копеек. */
function cleanAmt(s){
  s = String(s).replace(/\s/g, "").replace(/[.]/g, ",").replace(/[^\d,]/g, "");
  var i = s.indexOf(",");
  if (i > -1) s = s.slice(0, i + 1) + s.slice(i + 1).replace(/,/g, "");
  i = s.indexOf(",");
  var whole = i > -1 ? s.slice(0, i) : s;
  var frac  = i > -1 ? s.slice(i + 1, i + 3) : null;
  whole = whole.replace(/^0+(?=\d)/, "").slice(0, 12);
  if (frac === null) return whole;
  return (whole === "" ? "0" : whole) + "," + frac;
}

/* Поле суммы растёт под содержимое: ширину снимаем с невидимого двойника,
   а если число перестаёт помещаться в строку — уменьшаем кегль. */
var AMT_SIZE = 54;

function sizeAmt(inp){
  var mir = el("a-mirror"), box = el("a-box");
  if (!mir || !box) return;

  mir.style.fontSize = "";
  mir.textContent = inp.value || inp.placeholder || "0";

  var avail = box.clientWidth - 74;            // место под символ валюты и поля
  var w = mir.getBoundingClientRect().width;
  var size = AMT_SIZE;

  if (w > avail && w > 0) {
    size = Math.max(24, Math.floor(AMT_SIZE * avail / w));
    mir.style.fontSize = size + "px";
    w = mir.getBoundingClientRect().width;
  }

  inp.style.fontSize = size + "px";
  inp.style.width = Math.max(30, Math.ceil(w) + 10) + "px";
}

/* Основные категории — те, которыми пользователь пользуется чаще всего.
   Список сам подстраивается под привычки; выбранная категория остаётся
   на экране, даже если в топ она пока не попала. */
function topCats(kind, n){
  var all = catsOf(kind), use = {};
  S.tx.forEach(function(t){ use[t.categoryId] = (use[t.categoryId] || 0) + 1; });
  var top = all.slice().sort(function(a, b){
    var d = (use[b.id] || 0) - (use[a.id] || 0);
    return d !== 0 ? d : all.indexOf(a) - all.indexOf(b);
  }).slice(0, n);

  var shown = false;
  top.forEach(function(c){ if (c.id === A.cat) shown = true; });
  if (!shown && A.cat) {
    var sel = catById(A.cat);
    if (sel && sel.kind === kind) top[top.length - 1] = sel;
  }
  return top;
}

/* Категория по умолчанию, если пользователь не выбрал ничего.
   Если «Прочее» переименовали или удалили — берём последнюю в списке,
   так же, как это делает удаление категории. */
function fallbackCat(kind){
  var list = catsOf(kind);
  if (!list.length) return null;
  for (var i = 0; i < list.length; i++) if (list[i].name === "Прочее") return list[i];
  return list[list.length - 1];
}

function catTile(c){
  return '<button class="cat' + (c.id === A.cat ? " on" : "") + '" data-c="' + c.id + '" ' +
         'style="--pick:' + c.color + (c.id === A.cat ? ";background:" + c.color + "14" : "") + '">' +
         '<span class="e">' + c.emoji + '</span><span class="n">' + esc(c.name) + "</span></button>";
}

/* ---------- Шаблоны частых трат ---------- */

function tplById(id){
  for (var i = 0; i < S.templates.length; i++)
    if (S.templates[i].id === id) return S.templates[i];
  return null;
}

/* Форма шаблона. При создании с экрана ввода подставляем то,
   что уже набрано, — обычно ради этого шаблон и заводят. */
function editTemplate(id){
  var t = id ? tplById(id) : null;
  var isNew = !t;
  var d = t ? { name:t.name, amount:t.amount, kind:t.kind, categoryId:t.categoryId, note:t.note }
            : { name:"", amount:parseAmt(A.amt) || "", kind:A.kind,
                categoryId:A.cat || (fallbackCat(A.kind) || {}).id, note:A.note || "" };

  function opts(kind){
    return catsOf(kind).map(function(c){
      return '<option value="' + c.id + '"' + (c.id === d.categoryId ? " selected" : "") + ">" +
             c.emoji + " " + esc(c.name) + "</option>";
    }).join("");
  }

  var h = '<div class="seg" id="tp-seg">' +
          '<button class="sx' + (d.kind==="expense"?" on":"") + '" data-k="expense">Расход</button>' +
          '<button class="si' + (d.kind==="income" ?" on":"") + '" data-k="income">Доход</button></div>' +
          '<div style="height:16px"></div>' +
          '<label class="f"><span>Название</span>' +
          '<input id="tp-name" maxlength="24" placeholder="Например: Кофе" value="' + esc(d.name) + '"></label>' +
          '<label class="f"><span>Сумма (' + esc(symbol()) + ')</span>' +
          '<input id="tp-amt" type="text" inputmode="decimal" value="' +
          (d.amount ? String(d.amount).replace(".", ",") : "") + '"></label>' +
          '<label class="f"><span>Категория</span>' +
          '<select id="tp-cat">' + opts(d.kind) + "</select></label>" +
          '<label class="f"><span>Заметка</span>' +
          '<input id="tp-note" maxlength="60" value="' + esc(d.note || "") + '"></label>' +
          '<button class="btn" id="tp-ok">' + (isNew ? "Создать" : "Сохранить") + "</button>" +
          (isNew ? "" : '<button class="btn r" id="tp-del">Удалить шаблон</button>') +
          '<button class="btn g" id="tp-no">Отмена</button>';

  openSheet(isNew ? "Новый шаблон" : "Шаблон", h, function(ov){
    ov.querySelector("#tp-seg").onclick = function(e){
      var b = e.target.closest("button[data-k]"); if (!b) return;
      d.kind = b.dataset.k;
      d.categoryId = (fallbackCat(d.kind) || {}).id;
      ov.querySelectorAll("#tp-seg button").forEach(function(x){
        x.classList.toggle("on", x.dataset.k === d.kind);
      });
      ov.querySelector("#tp-cat").innerHTML = opts(d.kind);
    };
    ov.querySelector("#tp-ok").onclick = function(){
      var name = ov.querySelector("#tp-name").value.trim();
      var amt  = parseAmt(ov.querySelector("#tp-amt").value);
      if (!name) { toast("Введите название"); return; }
      if (amt <= 0) { toast("Введите сумму"); return; }
      var rec = { name:name, amount:amt, kind:d.kind,
                  categoryId: ov.querySelector("#tp-cat").value,
                  note: ov.querySelector("#tp-note").value.trim() };
      if (isNew) { rec.id = uid(); S.templates.push(rec); }
      else { t.name=rec.name; t.amount=rec.amount; t.kind=rec.kind;
             t.categoryId=rec.categoryId; t.note=rec.note; }
      saveState(); closeSheet(); renderAll();
      toast(isNew ? "Шаблон создан" : "Шаблон сохранён");
    };
    if (!isNew) ov.querySelector("#tp-del").onclick = function(){
      closeSheet();
      confirmSheet("Удалить шаблон?", "«" + t.name + "» исчезнет с экрана ввода. " +
        "Записанные по нему операции останутся.", "Удалить", true, function(){
          S.templates = S.templates.filter(function(x){ return x.id !== id; });
          saveState(); renderAll(); toast("Шаблон удалён");
        });
    };
    ov.querySelector("#tp-no").onclick = closeSheet;
  });
}

function templatesSheet(){
  var h = "";
  if (!S.templates.length) {
    h += '<div class="hint" style="text-align:center;padding:4px 4px 18px">' +
         "Шаблон — это готовая запись: название, сумма и категория. " +
         "Нажали на него на экране ввода — трата записана.</div>";
  } else {
    h += '<div class="card" style="padding:2px 16px" id="tl-list">';
    S.templates.forEach(function(t){
      var c = catById(t.categoryId) || { emoji:"❓", color:"#8e8e93", name:"без категории" };
      h += '<button class="row" data-tpl="' + t.id + '">' +
           '<span class="e" style="background:' + c.color + '26">' + c.emoji + "</span>" +
           '<div class="t"><b>' + esc(t.name) + "</b><small>" + esc(c.name) +
           (t.note ? " · " + esc(t.note) : "") + "</small></div>" +
           '<span class="v' + (t.kind === "expense" ? "" : " inc") + '">' +
           (t.kind === "expense" ? "−" : "+") + " " + fmt(t.amount) + "</span>" +
           '<span class="ch">' + IC.chev + "</span></button>";
    });
    h += "</div>";
  }
  h += '<button class="btn" id="tl-new">Создать шаблон</button>' +
       '<button class="btn g" id="tl-no">Закрыть</button>';

  openSheet("Шаблоны", h, function(ov){
    var list = ov.querySelector("#tl-list");
    if (list) list.onclick = function(e){
      var b = e.target.closest("button[data-tpl]"); if (!b) return;
      closeSheet(); editTemplate(b.dataset.tpl);
    };
    ov.querySelector("#tl-new").onclick = function(){ closeSheet(); editTemplate(null); };
    ov.querySelector("#tl-no").onclick = closeSheet;
  });
}

/* Полный список категорий — в шторке, чтобы не занимать главный экран. */
function pickCategory(kind){
  var h = '<div class="cats all" id="p-cats">';
  catsOf(kind).forEach(function(c){ h += catTile(c); });
  h += '</div><div style="height:16px"></div>' +
       '<button class="btn g" id="p-new">Новая категория</button>' +
       '<button class="btn g" id="p-no">Отмена</button>';

  openSheet(kind === "expense" ? "Категория расхода" : "Категория дохода", h, function(ov){
    ov.querySelector("#p-cats").onclick = function(e){
      var b = e.target.closest("button[data-c]"); if (!b) return;
      A.cat = b.dataset.c;
      closeSheet();
      renderAdd();
    };
    ov.querySelector("#p-new").onclick = function(){ closeSheet(); editCategory(null, kind); };
    ov.querySelector("#p-no").onclick = closeSheet;
  });
}

function renderAdd(){
  var cats = topCats(A.kind, 7);
  if (A.cat && !catById(A.cat)) A.cat = null;
  var sel = catById(A.cat);
  if (sel && sel.kind !== A.kind) A.cat = null;

  var cls = A.amt === "" ? "" : (A.kind === "expense" ? "exp" : "inc");

  var h = "";
  h += '<div class="seg" id="a-seg">' +
       '<button class="sx' + (A.kind==="expense"?" on":"") + '" data-k="expense">Расход</button>' +
       '<button class="si' + (A.kind==="income" ?" on":"") + '" data-k="income">Доход</button></div>';

  h += '<div class="amtbox ' + cls + '" id="a-box">' +
       '<input id="a-amt" type="text" inputmode="decimal" autocomplete="off" ' +
       'enterkeyhint="done" placeholder="0" value="' + esc(groupAmt(A.amt)) + '">' +
       '<span class="cur">' + esc(symbol()) + "</span>" +
       '<span class="amtmirror" id="a-mirror" aria-hidden="true"></span>' +
       '<button class="done" id="a-done">Готово</button></div>';

  h += '<div class="meta">' +
       '<button type="button" class="mchip mdate" id="a-datebtn">' + IC.cal +
         '<b id="a-datelbl">' + esc(dateLabel(A.date)) + "</b>" +
         '<input type="date" id="a-date" value="' + A.date + '" tabindex="-1">' +
       "</button>" +
       '<label class="mchip mnote">' + IC.note +
         '<input id="a-note" placeholder="заметка" value="' + esc(A.note) + '" maxlength="60">' +
       "</label></div>";

  /* Лента шаблонов. Пустой список ничего не рисует — место не тратится. */
  h += '<div class="tpls" id="a-tpls">';
  S.templates.forEach(function(t){
    var c = catById(t.categoryId) || { emoji:"❓" };
    h += '<button class="tpl" data-tpl="' + t.id + '">' +
         '<span class="te">' + c.emoji + "</span>" + esc(t.name) +
         '<i>' + fmt(t.amount, false) + "</i></button>";
  });
  h += '<button class="tpl add" data-tpl="__new">' + IC.plus + "</button>";
  h += "</div>";

  h += '<div class="cats" id="a-cats">';
  cats.forEach(function(c){ h += catTile(c); });
  h += '<button class="cat add" data-c="__all">' +
       '<span class="e">' + IC.grid + '</span><span class="n">Все</span></button>';
  h += "</div>";

  /* Подсказка живёт внутри подвала, чтобы отступы вокруг сетки категорий
     остались одинаковыми сверху и снизу. */
  var fb = fallbackCat(A.kind);
  var fbName = fb ? fb.name : "";
  h += '<div class="foot"><div class="fbhint" id="a-fbhint">' +
       (!A.cat && A.amt !== "" && fbName ? "без выбора запишется в «" + esc(fbName) + "»" : "") +
       "</div>" +
       '<button class="btn" id="a-save"' +
       (A.amt === "" ? " disabled" : "") + ">Сохранить</button></div>";

  /* Лента последних операций: сразу видно, что записалось, и можно поправить. */
  var last = S.tx.slice().sort(function(a, b){ return b.createdAt - a.createdAt; }).slice(0, 3);
  h += '<div class="recent"><div class="rhead">Последние</div>';
  if (!last.length) {
    h += '<div class="rempty">Здесь появятся последние операции</div>';
  } else {
    last.forEach(function(t){
      var c = catById(t.categoryId) ||
              { name:"Удалённая категория", emoji:"❓", color:"#8e8e93" };
      h += '<button class="rrow" data-tx="' + t.id + '">' +
           '<span class="e" style="background:' + c.color + '26">' + c.emoji + "</span>" +
           '<span class="t">' + esc(c.name) +
           (t.note ? ' <i>· ' + esc(t.note) + "</i>" : "") + "</span>" +
           '<span class="v' + (t.kind === "expense" ? "" : " inc") + '">' +
           (t.kind === "expense" ? "−" : "+") + " " + fmt(t.amount) + "</span></button>";
    });
  }
  h += "</div>";

  el("t-add").innerHTML = h;

  var amt = el("a-amt");
  sizeAmt(amt);

  /* Правим значение на месте, не перерисовывая экран, — иначе поле потеряет
     фокус и системная клавиатура закроется на первой же цифре. */
  amt.oninput = function(){
    var before = this.value.slice(0, this.selectionStart).replace(/[^\d,]/g, "").length;
    A.amt = cleanAmt(this.value);
    var out = groupAmt(A.amt);
    this.value = out;
    sizeAmt(this);
    var seen = 0, pos = before === 0 ? 0 : out.length;
    if (before > 0) {
      for (var i = 0; i < out.length; i++) {
        if (/[\d,]/.test(out.charAt(i)) && ++seen === before) { pos = i + 1; break; }
      }
    }
    try { this.setSelectionRange(pos, pos); } catch(e){}
    el("a-box").className = "amtbox " +
      (A.amt === "" ? "" : (A.kind === "expense" ? "exp" : "inc"));
    el("a-save").disabled = (A.amt === "");
    el("a-fbhint").textContent =
      (!A.cat && A.amt !== "" && fbName) ? "без выбора запишется в «" + fbName + "»" : "";
  };

  /* pointerdown с preventDefault: кнопка не перехватывает фокус и не успевает
     спрятаться раньше, чем сработает нажатие. */
  el("a-done").addEventListener("pointerdown", function(e){ e.preventDefault(); amt.blur(); });

  el("a-seg").onclick = function(e){
    var b = e.target.closest("button[data-k]"); if (!b) return;
    A.kind = b.dataset.k; A.cat = null; renderAdd();
  };

  el("a-date").onchange = function(){
    A.date = this.value || today();
    el("a-datelbl").textContent = dateLabel(A.date);
  };

  /* Нажатие ловит вся плашка целиком, а не только поле внутри неё. */
  el("a-datebtn").onclick = function(){
    var d = el("a-date");
    if (typeof d.showPicker === "function") {
      try { d.showPicker(); return; } catch(e){}
    }
    d.style.pointerEvents = "auto";
    d.focus();
    d.click();
    d.style.pointerEvents = "none";
  };
  el("a-note").oninput = function(){ A.note = this.value; };

  el("a-tpls").onclick = function(e){
    var b = e.target.closest("button[data-tpl]"); if (!b) return;
    if (b.dataset.tpl === "__new") { editTemplate(null); return; }
    var t = tplById(b.dataset.tpl); if (!t) return;
    if (addTx(t.kind, t.amount, t.categoryId, today(), t.note)) renderAdd();
  };

  el("a-cats").onclick = function(e){
    var b = e.target.closest("button[data-c]"); if (!b) return;
    if (b.dataset.c === "__all") { pickCategory(A.kind); return; }
    A.cat = (A.cat === b.dataset.c) ? null : b.dataset.c;
    renderAdd();
  };

  /* onclick, а не addEventListener: #t-add переживает перерисовки,
     и слушатели копились бы с каждым вызовом renderAdd. */
  el("t-add").onclick = function(e){
    var b = e.target.closest("button[data-tx]");
    if (b) editTx(b.dataset.tx);
  };

  el("a-save").onclick = saveTx;
}

function parseAmt(s){
  var v = parseFloat(String(s).replace(",", ".").replace(/\s/g,""));
  return isNaN(v) ? 0 : Math.round(v*100)/100;
}

/* Единственное место, где рождается операция: сюда ведут и обычное
   сохранение с экрана, и запись по шаблону. */
function addTx(kind, amount, categoryId, date, note){
  if (amount <= 0) { toast("Введите сумму"); return false; }

  var catId = categoryId;
  if (!catId || !catById(catId)) {
    var fb = fallbackCat(kind);
    if (!fb) { toast("Сначала создайте категорию"); return false; }
    catId = fb.id;
  }

  S.tx.push({ id: uid(), amount: amount, categoryId: catId, kind: kind,
              date: date || today(), note: (note || "").trim(), createdAt: Date.now() });
  saveState();
  toast((kind === "expense" ? "− " : "+ ") + fmt(amount) + " · " + catById(catId).name);
  return true;
}

function saveTx(){
  if (!addTx(A.kind, parseAmt(A.amt), A.cat, A.date, A.note)) return;
  A.amt = ""; A.note = "";
  renderAdd();
}

/* ---------- Вкладка «Месяц» ---------- */

var view = monthOf(today());

function renderMonth(){
  var list = txOfMonth(view);
  var exps = list.filter(function(t){ return t.kind === "expense"; });
  var incs = list.filter(function(t){ return t.kind === "income"; });
  var eSum = sum(exps), iSum = sum(incs), bal = iSum - eSum;

  var h = '<div class="nav2">' +
    '<button id="m-prev">' + IC.chevL + '</button><b>' + monthTitle(view) + "</b>" +
    '<button id="m-next"' + (view >= monthOf(today()) ? " disabled" : "") + ">" + IC.chev + "</button></div>";

  h += backupCard();

  /* Герой экрана — баланс месяца крупно и тонко, под ним две сводки. */
  h += '<div class="hero">' +
    '<div class="big' + (bal < 0 ? " neg" : "") + '">' +
      (bal > 0 ? "+" : "") + fmt(bal, false) + "</div>" +
    '<div class="cap">баланс за ' + monthTitle(view).toLowerCase() + ", " + esc(symbol()) + "</div>" +
    compareLine(eSum) +
    '<div class="chips">' +
      '<div class="chip"><span>Доходы</span><b class="inc">' + fmt(iSum) + "</b></div>" +
      '<div class="chip"><span>Расходы</span><b>' + fmt(eSum) + "</b></div>" +
    "</div></div>";

  if (S.totalLimit > 0) {
    var p = Math.min(100, eSum / S.totalLimit * 100);
    var over = eSum > S.totalLimit;
    h += '<div class="sec">Лимит на месяц</div><div class="card">' +
      '<div style="display:flex;justify-content:space-between;font:500 14px var(--f)">' +
      "<span>" + fmt(eSum) + '</span><span style="color:var(--mut)">из ' + fmt(S.totalLimit) + "</span></div>" +
      '<div class="bar"><i style="width:' + p + "%;background:" +
      (over ? "var(--red)" : "var(--acc)") + '"></i></div>' +
      '<div style="font:400 12px var(--f);margin-top:9px;color:' +
      (over ? "var(--red)" : "var(--mut)") + '">' +
      (over ? "перерасход " + fmt(eSum - S.totalLimit) : "осталось " + fmt(S.totalLimit - eSum)) +
      "</div></div>";
  }

  if (!list.length) {
    h += '<div class="empty"><span class="e">🗓</span>За этот месяц записей нет.<br>' +
         "Добавьте первую на вкладке «Добавить».</div>";
    el("t-month").innerHTML = h;
    bindMonthNav();
    return;
  }

  /* --- разбивка по категориям --- */
  var groups = {};
  exps.forEach(function(t){
    if (!groups[t.categoryId]) groups[t.categoryId] = 0;
    groups[t.categoryId] += t.amount;
  });
  var rows = Object.keys(groups).map(function(id){
    var c = catById(id) || { name:"Удалённая категория", emoji:"❓", color:"#8e8e93", limit:null };
    return { c:c, v:groups[id] };
  }).sort(function(a,b){ return b.v - a.v; });

  if (rows.length) {
    h += daily(view);

    h += '<div class="sec">Расходы по категориям</div>';
    h += stack(rows, eSum);
    h += '<div class="card">';
    rows.forEach(function(r){
      var pct = eSum ? Math.round(r.v / eSum * 100) : 0;
      h += '<div class="row"><span class="e" style="background:' + r.c.color + '26">' + r.c.emoji + "</span>" +
           '<div class="t"><b>' + esc(r.c.name) + "</b>";
      if (r.c.limit > 0) {
        var lp = Math.min(100, r.v / r.c.limit * 100), lo = r.v > r.c.limit;
        h += '<div class="bar" style="margin-top:5px"><i style="width:' + lp + "%;background:" +
             (lo ? "var(--red)" : r.c.color) + '"></i></div>' +
             '<small class="lim" style="margin-top:5px;color:' + (lo ? "var(--red)" : "var(--mut)") + '">' +
             (lo ? "перерасход " + fmt(r.v - r.c.limit) : "лимит " + fmt(r.c.limit) +
                   ", осталось " + fmt(r.c.limit - r.v)) + "</small>";
      }
      h += '</div><span class="v">' + fmt(r.v) + "<small>" + pct + " %</small></span></div>";
    });
    h += "</div>";
  }

  /* --- доходы по категориям --- */
  if (incs.length) {
    var ig = {};
    incs.forEach(function(t){ ig[t.categoryId] = (ig[t.categoryId] || 0) + t.amount; });
    h += '<div class="sec">Доходы по категориям</div><div class="card">';
    Object.keys(ig).sort(function(a,b){ return ig[b] - ig[a]; }).forEach(function(id){
      var c = catById(id) || { name:"Удалённая категория", emoji:"❓", color:"#8e8e93" };
      h += '<div class="row"><span class="e" style="background:' + c.color + '26">' + c.emoji + "</span>" +

/* ---------- Сравнение, график по дням, напоминание о копии ---------- */

/* Расходы прошлого месяца. Если записей не было — сравнивать не с чем. */
function prevExpenses(mk){
  var prev = txOfMonth(shiftMonth(mk, -1));
  if (!prev.length) return null;
  return sum(prev.filter(function(t){ return t.kind === "expense"; }));
}

var MONTHS_DAT = ["январю","февралю","марту","апрелю","маю","июню",
                  "июлю","августу","сентябрю","октябрю","ноябрю","декабрю"];

function compareLine(eSum){
  var was = prevExpenses(view);
  if (was === null || was <= 0) return "";
  var prevMk = shiftMonth(view, -1);
  var name = MONTHS_DAT[parseInt(prevMk.split("-")[1], 10) - 1];
  var diff = Math.round((eSum - was) / was * 100);
  if (diff === 0) return '<div class="cmp">расходы как в прошлом месяце</div>';
  var up = diff > 0;
  return '<div class="cmp ' + (up ? "up" : "down") + '">' +
    (up ? "↑" : "↓") + " " + Math.abs(diff) + " % к " + name + "</div>";
}

/* Столбики трат по дням месяца. Высота — доля от самого затратного дня. */
function daily(mk){
  var p = mk.split("-"), year = +p[0], mon = +p[1];
  var days = new Date(year, mon, 0).getDate();
  var byDay = [], max = 0;
  for (var d = 1; d <= days; d++) byDay[d] = 0;
  txOfMonth(mk).forEach(function(t){
    if (t.kind !== "expense") return;
    byDay[+t.date.slice(8,10)] += t.amount;
  });
  for (var i = 1; i <= days; i++) if (byDay[i] > max) max = byDay[i];
  if (max <= 0) return "";

  var bars = "";
  for (var n = 1; n <= days; n++) {
    var v = byDay[n];
    var pct = v > 0 ? Math.max(6, Math.round(v / max * 100)) : 0;
    bars += '<button class="dbar' + (v === max ? " top" : "") + (v <= 0 ? " zero" : "") +
            '" data-day="' + n + '" style="--hh:' + pct + '%"><i></i></button>';
  }
  var marks = "";
  [1, 8, 15, 22, days].forEach(function(n){
    marks += "<span>" + n + "</span>";
  });
  return '<div class="sec">По дням</div>' +
         '<div class="card"><div class="days" id="m-days">' + bars + "</div>" +
         '<div class="dmarks">' + marks + "</div></div>";
}

/* ---- напоминание о резервной копии ---- */

var DAY = 86400000;

function daysAgo(ts){ return Math.floor((Date.now() - ts) / DAY); }

function backupDue(){
  if (S.backupSnooze && Date.now() < S.backupSnooze) return false;
  if (S.lastBackup) return daysAgo(S.lastBackup) >= 30;
  return S.tx.length >= 20;
}

function backupCard(){
  if (!backupDue()) return "";
  var text = S.lastBackup
    ? "Последняя копия была " + daysAgo(S.lastBackup) + " дн. назад."
    : "Резервной копии ещё не было, а записей уже " + S.tx.length + ".";
  return '<div class="card nudge" id="m-nudge">' +
    "<b>Сделайте резервную копию</b>" +
    "<p>" + text + " Данные хранятся только на этом телефоне: " +
    "если удалить приложение или очистить Safari, восстановить их будет неоткуда.</p>" +
    '<div class="nrow"><button class="btn" id="nu-do">Сделать копию</button>' +
    '<button class="btn g" id="nu-later">Позже</button></div></div>';
}

/* Доли категорий одной горизонтальной полосой. Ширины задаются через
   flex-grow, поэтому зазоры между сегментами не ломают пропорции. */
function stack(rows, total){
  if (!total) return "";
  var h = '<div class="stack">';
  rows.forEach(function(r){
    if (r.v / total < 0.005) return;
    h += '<i style="flex:' + r.v + ';background:' + r.c.color + '"></i>';
  });
  return h + "</div>";
}

  if (!t) return;

  var opts = catsOf(t.kind).map(function(c){
    return '<option value="' + c.id + '"' + (c.id === t.categoryId ? " selected" : "") + ">" +
           c.emoji + " " + esc(c.name) + "</option>";

    '<label class="f"><span>Дата</span><input id="e-date" type="date" value="' + t.date + '"></label>' +
    '<label class="f"><span>Комментарий</span><input id="e-note" maxlength="60" value="' + esc(t.note || "") + '"></label>' +
    '<button class="btn" id="e-ok">Сохранить</button>' +
    '<button class="btn r" id="e-del">Удалить операцию</button>' +
    '<button class="btn g" id="e-no">Отмена</button>',
    function(ov){

        var v = parseAmt(ov.querySelector("#e-amt").value);
        if (v <= 0) { toast("Введите сумму"); return; }
        t.amount = v;
        t.categoryId = ov.querySelector("#e-cat").value;
        t.date = ov.querySelector("#e-date").value || t.date;
        t.note = ov.querySelector("#e-note").value.trim();
        saveState(); closeSheet(); renderAll(); toast("Сохранено");
      };
      ov.querySelector("#e-del").onclick = function(){
        closeSheet();
        confirmSheet("Удалить операцию?", fmt(t.amount) + " · " +
          ((catById(t.categoryId) || {}).name || "категория удалена"),
          "Удалить", true, function(){
            S.tx = S.tx.filter(function(x){ return x.id !== id; });
            saveState(); renderAll(); toast("Операция удалена");
          });
      };
      ov.querySelector("#e-no").onclick = closeSheet;
    });
}

function editCategory(id, kind){
  var c = id ? catById(id) : null;
  var isNew = !c;
  var draft = c ? { name:c.name, emoji:c.emoji, color:c.color, kind:c.kind, limit:c.limit }
                : { name:"", emoji:"📦", color:PAL[Math.floor(Math.random()*PAL.length)],

  var h = "";
  h += '<label class="f"><span>Название</span>' +
       '<input id="c-name" maxlength="28" placeholder="Например: Продукты" value="' + esc(draft.name) + '"></label>';
  h += '<label class="f"><span>Значок</span></label><div class="emo" id="c-emo">';
  EMO.forEach(function(e){
    h += '<button data-e="' + e + '"' + (e === draft.emoji ? ' class="on"' : "") + ">" + e + "</button>";
  });
  h += "</div>";
  h += '<label class="f" style="margin-top:12px"><span>Или введите свой значок</span>' +
       '<input id="c-emoji" maxlength="4" value="' + esc(draft.emoji) + '" style="text-align:center;font-size:24px"></label>';
  h += '<label class="f"><span>Цвет</span></label><div class="cols" id="c-col">';
  PAL.forEach(function(p){
    h += '<button data-p="' + p + '" style="background:' + p + '"' +
         (p === draft.color ? ' class="on"' : "") + "></button>";
  });
  h += "</div>";
  if (draft.kind === "expense") {
    h += '<label class="f" style="margin-top:14px"><span>Лимит на месяц, ' + esc(symbol()) +
         " (пусто — без лимита)</span>" +
         '<input id="c-lim" type="text" inputmode="decimal" placeholder="без лимита" value="' +
         (draft.limit > 0 ? String(draft.limit).replace(".",",") : "") + '"></label>';
  }
  h += '<button class="btn" id="c-ok">' + (isNew ? "Создать" : "Сохранить") + "</button>";
  if (!isNew) h += '<button class="btn r" id="c-del">Удалить категорию</button>';
  h += '<button class="btn g" id="c-no">Отмена</button>';

  openSheet(isNew ? (draft.kind === "expense" ? "Новая категория расхода" : "Новая категория дохода")
                  : "Категория", h,
    function(ov){
      var emojiInput = ov.querySelector("#c-emoji");
      ov.querySelector("#c-emo").onclick = function(e){
        var b = e.target.closest("button[data-e]"); if (!b) return;
        draft.emoji = b.dataset.e;
        emojiInput.value = draft.emoji;
        ov.querySelectorAll("#c-emo button").forEach(function(x){ x.classList.remove("on"); });
        b.classList.add("on");
      };
      emojiInput.oninput = function(){ draft.emoji = this.value; };
      ov.querySelector("#c-col").onclick = function(e){
        var b = e.target.closest("button[data-p]"); if (!b) return;
        draft.color = b.dataset.p;
        ov.querySelectorAll("#c-col button").forEach(function(x){ x.classList.remove("on"); });
        b.classList.add("on");
      };
      ov.querySelector("#c-ok").onclick = function(){
        var name = ov.querySelector("#c-name").value.trim();
        if (!name) { toast("Введите название"); return; }
        var emo = emojiInput.value.trim() || "📦";
        var lim = null;
        var li = ov.querySelector("#c-lim");
        if (li && li.value.trim()) { lim = parseAmt(li.value); if (lim <= 0) lim = null; }
        if (isNew) {
          var nc = { id: uid(), name:name, emoji:emo, color:draft.color, kind:draft.kind, limit:lim };
          S.categories.push(nc);
          if (A.kind === nc.kind) A.cat = nc.id;
        } else {
          c.name = name; c.emoji = emo; c.color = draft.color; c.limit = lim;
        }
        saveState(); closeSheet(); renderAll();
        toast(isNew ? "Категория создана" : "Сохранено");
      };
      if (!isNew) ov.querySelector("#c-del").onclick = function(){
        closeSheet(); deleteCategory(c);
      };
      ov.querySelector("#c-no").onclick = closeSheet;
    });
}

function deleteCategory(c){
  var used = S.tx.filter(function(t){ return t.categoryId === c.id; });
  var same = catsOf(c.kind).filter(function(x){ return x.id !== c.id; });
  if (!same.length) { toast("Нельзя удалить последнюю категорию"); return; }

  var fallback = null;
  for (var i=0;i<same.length;i++) if (same[i].name === "Прочее") fallback = same[i];
  if (!fallback) fallback = same[same.length-1];

  var text = used.length
    ? "По этой категории есть операций: " + used.length + ". Они будут перенесены в «" +
      fallback.name + "», суммы сохранятся."
    : "Операций по этой категории нет.";

  confirmSheet("Удалить «" + c.name + "»?", text, "Удалить", true, function(){
    S.tx.forEach(function(t){ if (t.categoryId === c.id) t.categoryId = fallback.id; });
    S.categories = S.categories.filter(function(x){ return x.id !== c.id; });
    if (A.cat === c.id) A.cat = null;
    saveState(); renderAll(); toast("Категория удалена");
  });
}

      "Будут стёрты все " + S.tx.length + " операций и настройки категорий. Отменить будет нельзя.",

        confirmSheet("Точно удалить?", "Последнее подтверждение. Сначала лучше сделать резервную копию.",
          "Да, удалить", true, function(){
            S = defaultState(); saveState();
            view = monthOf(today()); A = { kind:"expense", amt:"", cat:null, date:today(), note:"" };
            renderAll(); toast("Все данные удалены");
          });
      });
  };
}

/* ---------- Экспорт / импорт ---------- */

function csvCell(v){
  var s = String(v == null ? "" : v);
  return /[";\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}

function exportCsv(mk){
  var list = mk ? txOfMonth(mk) : S.tx.slice();
  if (!list.length) { toast("Нет операций для экспорта"); return; }
  list.sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : a.createdAt - b.createdAt; });

  var lines = ["дата;тип;категория;сумма;валюта;комментарий"];
  list.forEach(function(t){
    var c = catById(t.categoryId);
    lines.push([
      csvCell(t.date),
      t.kind === "expense" ? "расход" : "доход",
      csvCell(c ? c.name : "Удалённая категория"),
      csvCell(String(t.amount).replace(".", ",")),
      csvCell(symbol()),
      csvCell(t.note || "")
    ].join(";"));
  });
  var name = "финансы-" + (mk || "все") + ".csv";
  share(name, "\uFEFF" + lines.join("\r\n"), "text/csv");
}

function exportJson(){
  var name = "баланс-копия-" + today() + ".json";
  share(name, JSON.stringify(S), "application/json");
  S.lastBackup = Date.now();
  S.backupSnooze = null;
  saveState();
  renderMonth(); renderSet();
}

function share(name, text, mime){
  var done = false;
  try {
    var f = new File([text], name, { type: mime });
    if (navigator.canShare && navigator.canShare({ files:[f] })) {
      done = true;
      navigator.share({ files:[f] }).catch(function(){ textSheet(name, text); });
    }
  } catch(e){}
  if (!done) textSheet(name, text);
}

function textSheet(name, text){
  openSheet(name,
    '<div class="hint" style="padding:0 4px 12px">Поделиться файлом не удалось. ' +
    "Скопируйте текст ниже и сохраните его в «Заметки» или отправьте себе в мессенджер.</div>" +
    '<textarea id="x-t" readonly>' + esc(text) + "</textarea>" +
    '<div style="height:12px"></div>' +
    '<button class="btn" id="x-c">Скопировать</button>' +
    '<button class="btn g" id="x-n">Закрыть</button>',
    function(ov){
      ov.querySelector("#x-c").onclick = function(){
        var ta = ov.querySelector("#x-t");
        ta.focus(); ta.setSelectionRange(0, ta.value.length);
        var ok = false;
        try { ok = document.execCommand("copy"); } catch(e){}
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(function(){ toast("Скопировано"); },
          function(){ if (!ok) toast("Скопируйте вручную"); });
        else toast(ok ? "Скопировано" : "Скопируйте вручную");
      };
      ov.querySelector("#x-n").onclick = closeSheet;
    });
}

function importSheet(){
  openSheet("Восстановить из копии",
    '<div class="hint" style="padding:0 4px 12px">Вставьте содержимое файла резервной копии (JSON). ' +
    "Текущие данные будут полностью заменены.</div>" +
    '<textarea id="i-t" placeholder="{&quot;version&quot;:1, ...}"></textarea>' +
    '<div style="height:12px"></div>' +
    '<button class="btn" id="i-ok">Восстановить</button>' +
    '<button class="btn g" id="i-no">Отмена</button>',
    function(ov){
      ov.querySelector("#i-ok").onclick = function(){
        var raw = ov.querySelector("#i-t").value.trim();
        var data;
        try { data = JSON.parse(raw); } catch(e){ toast("Это не похоже на JSON"); return; }
        if (!data || !Array.isArray(data.categories) || !Array.isArray(data.tx)) {
          toast("В файле нет данных приложения"); return;
        }
        closeSheet();
        confirmSheet("Заменить данные?",
          "В копии: " + data.tx.length + " операций и " + data.categories.length +
          " категорий. Текущие " + S.tx.length + " операций будут удалены.",
          "Восстановить", true, function(){
            S = data;
            if (!S.currency) S.currency = "UAH";
            if (typeof S.totalLimit === "undefined") S.totalLimit = null;
            saveState();
            view = monthOf(today()); A = { kind:"expense", amt:"", cat:null, date:today(), note:"" };
            renderAll(); toast("Данные восстановлены");
          });
      };
      ov.querySelector("#i-no").onclick = closeSheet;
    });
}

/* ---------- Код-пароль ----------
   Код хранится хешем, чтобы не лежать открытым текстом в файле резервной
   копии. Это защита от чужих глаз, а не шифрование: содержимое
   localStorage остаётся доступным тому, у кого есть доступ к устройству. */

function pinHash(code){
  var h = 5381;
  for (var i = 0; i < code.length; i++) h = ((h * 33) ^ code.charCodeAt(i)) >>> 0;
  return "h" + h.toString(36);
}

/* Общая шторка ввода кода: подпись, точки и своя цифровая клавиатура. */
function askPin(title, note, onDone){
  var code = "";
  var h = '<p class="pinnote">' + esc(note) + "</p>" +
          '<div class="dots" id="pk-dots">' +
          "<i></i><i></i><i></i><i></i></div>" +
          '<div class="pinpad" id="pk-pad">';
  ["1","2","3","4","5","6","7","8","9","","0","⌫"].forEach(function(k){
    h += k === "" ? "<span></span>"
       : '<button data-k="' + k + '">' + (k === "⌫" ? IC.back : k) + "</button>";
  });
  h += "</div>" + '<button class="btn g" id="pk-no">Отмена</button>';

  var ov = openSheet(title, h, function(ov){
    function paint(bad){
      var dots = ov.querySelectorAll("#pk-dots i");
      for (var i = 0; i < 4; i++) dots[i].className = i < code.length ? "on" : "";
      ov.querySelector("#pk-dots").classList.toggle("bad", !!bad);
    }
    ov.querySelector("#pk-pad").onclick = function(e){
      var b = e.target.closest("button[data-k]"); if (!b) return;
      var k = b.dataset.k;
      if (k === "⌫") code = code.slice(0, -1);
      else if (code.length < 4) code += k;
      paint(false);
      if (code.length === 4) {
        var entered = code;
        setTimeout(function(){
          if (onDone(entered) === false) { code = ""; paint(true);
            setTimeout(function(){ paint(false); }, 600); }
        }, 120);
      }
    };
    ov.querySelector("#pk-no").onclick = closeSheet;
  });
  return ov;
}

function pinSettings(){
  if (!S.pin) {
    askPin("Новый код", "Придумайте код из четырёх цифр.", function(first){
      closeSheet();
      askPin("Повторите код", "Введите тот же код ещё раз.", function(second){
        if (second !== first) { toast("Коды не совпали"); return false; }
        closeSheet();
        confirmSheet("Включить код-пароль?",
          "Восстановить забытый код нельзя — останется только стереть данные " +
          "и восстановить их из резервной копии. Сделайте копию заранее.",
          "Включить", false, function(){
            S.pin = pinHash(first); saveState(); renderSet(); toast("Код-пароль включён");
          });
      });
    });
  } else {
    askPin("Выключить код", "Введите текущий код.", function(code){
      if (pinHash(code) !== S.pin) return false;
      S.pin = null; saveState(); closeSheet(); renderSet(); toast("Код-пароль выключен");
    });
  }
}

/* Экран блокировки поверх всего приложения. */
function lockScreen(){
  var code = "";
  var lock = document.createElement("div");
  lock.id = "lock";
  var pad = "";
  ["1","2","3","4","5","6","7","8","9","","0","⌫"].forEach(function(k){
    pad += k === "" ? "<span></span>"
         : '<button data-k="' + k + '">' + (k === "⌫" ? IC.back : k) + "</button>";
  });
  lock.innerHTML =
    '<div class="lockbox">' +
      '<div class="lockmark">₴</div>' +
      "<h2>Баланс</h2>" +
      '<p class="pinnote">Введите код</p>' +
      '<div class="dots" id="lk-dots"><i></i><i></i><i></i><i></i></div>' +
      '<div class="pinpad" id="lk-pad">' + pad + "</div>" +
      '<button class="lkforgot" id="lk-forgot">Не помню код</button>' +
    "</div>";
  document.body.appendChild(lock);

  function paint(bad){
    var dots = lock.querySelectorAll("#lk-dots i");
    for (var i = 0; i < 4; i++) dots[i].className = i < code.length ? "on" : "";
    lock.querySelector("#lk-dots").classList.toggle("bad", !!bad);
  }

  lock.querySelector("#lk-pad").onclick = function(e){
    var b = e.target.closest("button[data-k]"); if (!b) return;
    var k = b.dataset.k;
    if (k === "⌫") code = code.slice(0, -1);
    else if (code.length < 4) code += k;
    paint(false);
    if (code.length === 4) {
      if (pinHash(code) === S.pin) {
        lock.classList.add("off");
        setTimeout(function(){ lock.remove(); }, 220);
      } else {
        code = ""; paint(true);
        setTimeout(function(){ paint(false); }, 600);
      }
    }
  };

  lock.querySelector("#lk-forgot").onclick = function(){
    confirmSheet("Код восстановить нельзя",
      "Единственный выход — стереть все данные приложения и восстановить их " +
      "из файла резервной копии, если он у вас есть.",
      "Стереть всё", true, function(){
        confirmSheet("Точно стереть?", "Все операции и категории будут удалены безвозвратно.",
          "Да, стереть", true, function(){
            localStorage.removeItem(KEY);
            location.reload();
          });
      });
  };
}

/* ---------- Навигация ---------- */

var tab = "add";

function renderAll(){
  renderAdd(); renderMonth(); renderCats(); renderSet();
}

function go(t){
  tab = t;
  ["add","month","cats","set"].forEach(function(x){
    el("t-" + x).classList.toggle("on", x === t);
  });
  document.querySelectorAll("#nav button").forEach(function(b){
    b.classList.toggle("on", b.dataset.t === t);
  });
  el("main").classList.toggle("fixed", t === "add");
  if (t === "month") { view = monthOf(today()); renderMonth(); }
  if (t === "set") renderSet();
  el("main").scrollTop = 0;
}

el("nav").onclick = function(e){
  var b = e.target.closest("button[data-t]"); if (!b) return;
  go(b.dataset.t);
};

/* ---------- Старт ---------- */

S = loadState();
saveState();
renderAll();
go("add");
if (S.pin) lockScreen();
</script>
